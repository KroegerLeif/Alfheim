# ==============================================================================
# VOLUMES & PERSISTENT DATA
# ==============================================================================
volumes:
  caddy_data:
  caddy_config:
  postgres_core_data:
  rustfs_data:
  victoriametrics_data:
  victorialogs_data:
  grafana_data:

# ==============================================================================
# DOCKER NETWORKS
# ==============================================================================
networks:
  gateway-net:
    name: gateway-net
    driver: bridge
  infra-net:
    name: infra-net
    driver: bridge
  core-net:
    name: core-net
    driver: bridge
  app-chat-net:
    name: app-chat-net
    driver: bridge
  app-pantry-net:
    name: app-pantry-net
    driver: bridge
  app-shopping-net:
    name: app-shopping-net
    driver: bridge
  app-maintenance-net:
    name: app-maintenance-net
    driver: bridge
  app-chores-net:
    name: app-chores-net
    driver: bridge
  app-budget-net:
    name: app-budget-net
    driver: bridge
  app-workout-net:
    name: app-workout-net
    driver: bridge
  app-library-net:
    name: app-library-net
    driver: bridge
  observability-internal:
    name: observability-internal
    driver: bridge
  # Private link between Vector and its Docker socket proxy only. internal: true
  # removes any route out of the host network, so nothing else can reach the proxy.
  docker-proxy-net:
    name: docker-proxy-net
    driver: bridge
    internal: true
