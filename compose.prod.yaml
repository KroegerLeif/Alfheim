# ==============================================================================
# alfheim: Production Docker Compose Orchestration (compose.prod.yaml)
# ==============================================================================
# Single-host production deployment for self-hosted home servers.
# Uses pre-built container images from GitHub Container Registry (ghcr.io).
#
# Usage:
#   docker compose -f compose.prod.yaml up -d
#   docker compose -f compose.prod.yaml down
#   docker compose -f compose.prod.yaml pull
# ==============================================================================

name: alfheim-prod

services:
  # ----------------------------------------------------------------------------
  # 1. INGRESS GATEWAY & REVERSE PROXY
  # ----------------------------------------------------------------------------
  caddy:
    # Custom build: the stock caddy image ships no ACME DNS-01 provider
    # modules, which the Hetzner and Cloudflare TLS strategies require.
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/caddy:${IMAGE_TAG:-latest}
    build:
      context: ./infrastructure/caddy
      dockerfile: Dockerfile
    container_name: alfheim_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALFHEIM_HOST: "${ALFHEIM_HOST:-alfheim.loegien.de}"
      ALFHEIM_DOMAIN: "${DOMAIN:-loegien.de}"
      ALFHEIM_AUTH_HOST: "${ZITADEL_EXTERNALDOMAIN:-auth.loegien.de}"
      CADDY_TLS_DIRECTIVE: "${CADDY_TLS_DIRECTIVE:-}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
      HETZNER_API_TOKEN: "${HETZNER_API_TOKEN:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/livez || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gateway-net

  # ----------------------------------------------------------------------------
  # 2. CONSOLIDATED POSTGRESQL CORE DATABASE SERVER & IAM / CENTRAL STORAGE
  # ----------------------------------------------------------------------------
  postgres-core:
    image: postgres:16-alpine
    container_name: alfheim_postgres_core
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secret_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      ZITADEL_DB_USER: ${ZITADEL_DB_USER:-zitadel_user}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:-postgres}
      DASHBOARD_POSTGRES_USER: ${DASHBOARD_POSTGRES_USER:-dashboard_user}
      DASHBOARD_POSTGRES_PASSWORD: ${DASHBOARD_POSTGRES_PASSWORD:-postgres}
      PANTRY_POSTGRES_USER: ${PANTRY_POSTGRES_USER:-pantry_user}
      PANTRY_POSTGRES_PASSWORD: ${PANTRY_POSTGRES_PASSWORD:-postgres}
      SHOPPING_POSTGRES_USER: ${SHOPPING_POSTGRES_USER:-shopping_user}
      SHOPPING_POSTGRES_PASSWORD: ${SHOPPING_POSTGRES_PASSWORD:-postgres}
      MAINTENANCE_POSTGRES_USER: ${MAINTENANCE_POSTGRES_USER:-maintenance_user}
      MAINTENANCE_POSTGRES_PASSWORD: ${MAINTENANCE_POSTGRES_PASSWORD:-postgres}
      CHORES_POSTGRES_USER: ${CHORES_POSTGRES_USER:-chores_user}
      CHORES_POSTGRES_PASSWORD: ${CHORES_POSTGRES_PASSWORD:-postgres}
      BUDGET_POSTGRES_USER: ${BUDGET_POSTGRES_USER:-budget_user}
      BUDGET_POSTGRES_PASSWORD: ${BUDGET_POSTGRES_PASSWORD:-postgres}
      CHAT_POSTGRES_USER: ${CHAT_POSTGRES_USER:-chat_user}
      CHAT_POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:-postgres}
      WORKOUT_POSTGRES_USER: ${WORKOUT_POSTGRES_USER:-workout_user}
      WORKOUT_POSTGRES_PASSWORD: ${WORKOUT_POSTGRES_PASSWORD:-postgres}
      LIBRARY_POSTGRES_USER: ${LIBRARY_POSTGRES_USER:-library_user}
      LIBRARY_POSTGRES_PASSWORD: ${LIBRARY_POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./infrastructure/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      infra-net:
        aliases:
          - postgres-core
          - postgres-iam
      core-net:
        aliases:
          - postgres-core
          - dashboard-db
      app-pantry-net:
        aliases:
          - postgres-core
          - pantry-db
      app-shopping-net:
        aliases:
          - postgres-core
          - shopping-db
      app-chores-net:
        aliases:
          - postgres-core
          - chores-db
      app-maintenance-net:
        aliases:
          - postgres-core
          - maintenance-db
      app-budget-net:
        aliases:
          - postgres-core
          - budget-db
      app-chat-net:
        aliases:
          - postgres-core
          - chat-db
      app-workout-net:
        aliases:
          - postgres-core
          - workout-db
      app-library-net:
        aliases:
          - postgres-core
          - library-db
    stop_grace_period: 10s

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.66.1
    container_name: alfheim_zitadel
    init: true
    restart: unless-stopped
    command: >-
      start-from-init
      --masterkey "${ZITADEL_MASTERKEY}"
      --tlsMode disabled
    environment:
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_EXTERNALDOMAIN: "${ZITADEL_EXTERNALDOMAIN:-auth.loegien.de}"
      ZITADEL_EXTERNALPORT: "${ZITADEL_EXTERNALPORT:-443}"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: "${ZITADEL_DB_HOST:-postgres-core}"
      ZITADEL_DATABASE_POSTGRES_PORT: "${ZITADEL_DB_PORT:-5432}"
      ZITADEL_DATABASE_POSTGRES_DATABASE: "${ZITADEL_DB_NAME:-zitadel}"
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: "${ZITADEL_DB_USER:-zitadel_user}"
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${ZITADEL_DB_PASSWORD:-postgres}"
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: "${POSTGRES_USER:-postgres}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "${POSTGRES_PASSWORD:-super_secret_local_password}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: "${ZITADEL_FIRSTINSTANCE_ORG_NAME:-Alfheim}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME:-admin}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:-Password1!}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: alfheim_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 5s

  rustfs:
    # RustFS is the intended S3 implementation (see infrastructure/rustfs/README.md).
    # MinIO was a stand-in and its Docker Hub repo was withdrawn upstream, so
    # `minio/minio:*` is no longer pullable at all. Pinned to an explicit tag:
    # `latest` currently tracks a release candidate and would drift under CI.
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: alfheim_rustfs
    restart: unless-stopped
    # No `command:` override -- the image entrypoint starts the server using
    # RUSTFS_VOLUMES (baked in as /data). Passing MinIO's `server /data` makes
    # RustFS read `server` as an additional volume path.
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:-minioadmin}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

  # ----------------------------------------------------------------------------
  # 3. OBSERVABILITY & TELEMETRY
  # ----------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - "-retentionPeriod=14d"
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-internal

  victorialogs:
    image: victoriametrics/victoria-logs:v0.25.0-victorialogs
    container_name: victorialogs
    restart: unless-stopped
    command:
      - "-retentionPeriod=7d"
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-internal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/telemetry/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
    networks:
      - observability-internal

  grafana:
    image: grafana/grafana:11.0.0
    container_name: alfheim_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${NEXT_PUBLIC_FRONTEND_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway-net
      - observability-internal

  # ----------------------------------------------------------------------------
  # 4. CONTROL PLANE: DASHBOARD SERVICE
  # ----------------------------------------------------------------------------
  dashboard-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/dashboard-backend:${IMAGE_TAG:-latest}
    container_name: dashboard-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=${DASHBOARD_DATABASE_URL:-postgres://${DASHBOARD_POSTGRES_USER:-dashboard_user}:${DASHBOARD_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${DASHBOARD_POSTGRES_DB:-alfheim_dashboard}?sslmode=disable}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://auth.loegien.de}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-alfheim}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    depends_on:
      zitadel:
        condition: service_healthy
      postgres-core:
        condition: service_healthy
    networks:
      - gateway-net
      - core-net

  dashboard-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/dashboard-frontend:${IMAGE_TAG:-latest}
    container_name: dashboard-frontend
    restart: unless-stopped
    depends_on:
      dashboard-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}}
      - NEXT_PUBLIC_OIDC_ISSUER=${NEXT_PUBLIC_OIDC_ISSUER:-https://auth.loegien.de}
      - NEXT_PUBLIC_OIDC_CLIENT_ID=${NEXT_PUBLIC_OIDC_CLIENT_ID:-dashboard-frontend}
      - NEXT_PUBLIC_OIDC_REDIRECT_URI=${NEXT_PUBLIC_OIDC_REDIRECT_URI:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://auth.loegien.de}
      - ALFHEIM_BASE_URL=${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - gateway-net

  # ----------------------------------------------------------------------------
  # 5. CHAT ASSISTANT SERVICE
  # ----------------------------------------------------------------------------
  chat-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/chat-backend:${IMAGE_TAG:-latest}
    container_name: chat-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8080
      - DATABASE_URL=${CHAT_DATABASE_URL:-postgres://${CHAT_POSTGRES_USER:-chat_user}:${CHAT_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${CHAT_POSTGRES_DB:-alfheim_chat}?sslmode=disable}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL:-http://keycloak:8080/auth}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-alfheim}
      - KEYCLOAK_PUBLIC_ISSUER=${KEYCLOAK_PUBLIC_ISSUER:-${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}/realms/alfheim}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://rustfs:9000}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/storage}
      - CHAT_ENCRYPTION_KEY=${CHAT_ENCRYPTION_KEY:-}
      - CHAT_ENCRYPTION_KEY_ID=${CHAT_ENCRYPTION_KEY_ID:-v1}
      - CHAT_MCP_SERVERS=${CHAT_MCP_SERVERS:-pantry=http://pantry-backend:8000/mcp,chores=http://chores-backend:8000/mcp,maintenance=http://maintenance-backend:8000/mcp}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/chat/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    depends_on:
      zitadel:
        condition: service_healthy
      postgres-core:
        condition: service_healthy
    networks:
      - gateway-net
      - app-chat-net
      - observability-internal

  chat-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/chat-frontend:${IMAGE_TAG:-latest}
    container_name: chat-frontend
    restart: unless-stopped
    depends_on:
      chat-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}}
      - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - ALFHEIM_BASE_URL=${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/chat/de', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - gateway-net

  # ----------------------------------------------------------------------------
  # 6. PANTRY MANAGEMENT SERVICE
  # ----------------------------------------------------------------------------
  pantry-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/pantry-backend:${IMAGE_TAG:-latest}
    container_name: pantry-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${PANTRY_DATABASE_URL:-postgresql+asyncpg://${PANTRY_POSTGRES_USER:-pantry_user}:${PANTRY_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${PANTRY_POSTGRES_DB:-alfheim_pantry}}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/auth}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=pantry-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    depends_on:
      zitadel:
        condition: service_healthy
      postgres-core:
        condition: service_healthy
    networks:
      - gateway-net
      - app-pantry-net
      - observability-internal

  pantry-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/pantry-frontend:${IMAGE_TAG:-latest}
    container_name: pantry-frontend
    restart: unless-stopped
    depends_on:
      pantry-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}}
      - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - ALFHEIM_BASE_URL=${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/pantry/en', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - gateway-net

  # ----------------------------------------------------------------------------
  # 7. SHOPPING LIST SERVICE
  # ----------------------------------------------------------------------------
  shopping-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/shopping-backend:${IMAGE_TAG:-latest}
    container_name: shopping-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${SHOPPING_DATABASE_URL:-postgresql+asyncpg://${SHOPPING_POSTGRES_USER:-shopping_user}:${SHOPPING_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${SHOPPING_POSTGRES_DB:-alfheim_shopping}}
      - PANTRY_BACKEND_URL=${PANTRY_BACKEND_URL:-http://pantry-backend:8000}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/auth}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=shopping-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    depends_on:
      zitadel:
        condition: service_healthy
      postgres-core:
        condition: service_healthy
    networks:
      - gateway-net
      - app-shopping-net
      - observability-internal

  shopping-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/shopping-frontend:${IMAGE_TAG:-latest}
    container_name: shopping-frontend
    restart: unless-stopped
    depends_on:
      shopping-backend:
        condition: service_healthy
    environment:
      - PORT=3010
      - NODE_OPTIONS=--max-http-header-size=65536
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}}
      - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/auth}
      - ALFHEIM_BASE_URL=${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3010/shopping/en', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - gateway-net

  # ----------------------------------------------------------------------------
  # 8. MAINTENANCE & DEVICES SERVICE
  # ----------------------------------------------------------------------------
  maintenance-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/maintenance-backend:${IMAGE_TAG:-latest}
    container_name: maintenance-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${MAINTENANCE_DATABASE_URL:-postgresql+asyncpg://${MAINTENANCE_POSTGRES_USER:-maintenance_user}:${MAINTENANCE_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${MAINTENANCE_POSTGRES_DB:-alfheim_maintenance}}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/auth}
