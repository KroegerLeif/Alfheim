# ==============================================================================
# alfheim: Production Docker Compose Orchestration (compose.prod.yaml)
# ==============================================================================
# Single-host production deployment for self-hosted home servers.
# Uses pre-built container images from GitHub Container Registry (ghcr.io).
#
# Usage:
#   docker compose -f compose.prod.yaml up -d
#   docker compose -f compose.prod.yaml down
#   docker compose -f compose.prod.yaml pull
# ==============================================================================

name: alfheim-prod

services:
  # ----------------------------------------------------------------------------
  # 1. INGRESS GATEWAY & REVERSE PROXY
  # ----------------------------------------------------------------------------
  caddy:
    # Custom build: the stock caddy image ships no ACME DNS-01 provider
    # modules, which the Hetzner and Cloudflare TLS strategies require.
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/caddy:${IMAGE_TAG:-latest}
    build:
      context: ./infrastructure/caddy
      dockerfile: Dockerfile
    container_name: alfheim_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALFHEIM_HOST: "${ALFHEIM_HOST:-alfheim.loegien.de}"
      ALFHEIM_DOMAIN: "${DOMAIN:-loegien.de}"
      ALFHEIM_AUTH_HOST: "${ZITADEL_EXTERNALDOMAIN:-auth.loegien.de}"
      CADDY_TLS_DIRECTIVE: "${CADDY_TLS_DIRECTIVE:-}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
      HETZNER_API_TOKEN: "${HETZNER_API_TOKEN:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/livez || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      # Backends validate access tokens by fetching OIDC discovery/JWKS from
      # OIDC_ISSUER_URL (http://<ZITADEL_EXTERNALDOMAIN>) from inside their
      # own containers. Aliasing both external hostnames to Caddy on this
      # network is what makes that resolvable without host DNS or a
      # container-internal issuer override.
      gateway-net:
        aliases:
          - "${ZITADEL_EXTERNALDOMAIN:?ZITADEL_EXTERNALDOMAIN must be set}"
          - "${ALFHEIM_HOST:?ALFHEIM_HOST must be set}"

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.5
        reservations:
          memory: 256m
          cpus: 0.5
  # ----------------------------------------------------------------------------
  # 2. CONSOLIDATED POSTGRESQL CORE DATABASE SERVER & IAM / CENTRAL STORAGE
  # ----------------------------------------------------------------------------
  postgres-core:
    image: postgres:16-alpine
    container_name: alfheim_postgres_core
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      ZITADEL_DB_USER: ${ZITADEL_DB_USER:?ZITADEL_DB_USER must be set}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:?ZITADEL_DB_PASSWORD must be set}
      DASHBOARD_POSTGRES_USER: ${DASHBOARD_POSTGRES_USER:?DASHBOARD_POSTGRES_USER must be set}
      DASHBOARD_POSTGRES_PASSWORD: ${DASHBOARD_POSTGRES_PASSWORD:?DASHBOARD_POSTGRES_PASSWORD must be set}
      PANTRY_POSTGRES_USER: ${PANTRY_POSTGRES_USER:?PANTRY_POSTGRES_USER must be set}
      PANTRY_POSTGRES_PASSWORD: ${PANTRY_POSTGRES_PASSWORD:?PANTRY_POSTGRES_PASSWORD must be set}
      SHOPPING_POSTGRES_USER: ${SHOPPING_POSTGRES_USER:?SHOPPING_POSTGRES_USER must be set}
      SHOPPING_POSTGRES_PASSWORD: ${SHOPPING_POSTGRES_PASSWORD:?SHOPPING_POSTGRES_PASSWORD must be set}
      MAINTENANCE_POSTGRES_USER: ${MAINTENANCE_POSTGRES_USER:?MAINTENANCE_POSTGRES_USER must be set}
      MAINTENANCE_POSTGRES_PASSWORD: ${MAINTENANCE_POSTGRES_PASSWORD:?MAINTENANCE_POSTGRES_PASSWORD must be set}
      CHORES_POSTGRES_USER: ${CHORES_POSTGRES_USER:?CHORES_POSTGRES_USER must be set}
      CHORES_POSTGRES_PASSWORD: ${CHORES_POSTGRES_PASSWORD:?CHORES_POSTGRES_PASSWORD must be set}
      BUDGET_POSTGRES_USER: ${BUDGET_POSTGRES_USER:?BUDGET_POSTGRES_USER must be set}
      BUDGET_POSTGRES_PASSWORD: ${BUDGET_POSTGRES_PASSWORD:?BUDGET_POSTGRES_PASSWORD must be set}
      CHAT_POSTGRES_USER: ${CHAT_POSTGRES_USER:?CHAT_POSTGRES_USER must be set}
      CHAT_POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:?CHAT_POSTGRES_PASSWORD must be set}
      WORKOUT_POSTGRES_USER: ${WORKOUT_POSTGRES_USER:?WORKOUT_POSTGRES_USER must be set}
      WORKOUT_POSTGRES_PASSWORD: ${WORKOUT_POSTGRES_PASSWORD:?WORKOUT_POSTGRES_PASSWORD must be set}
      LIBRARY_POSTGRES_USER: ${LIBRARY_POSTGRES_USER:?LIBRARY_POSTGRES_USER must be set}
      LIBRARY_POSTGRES_PASSWORD: ${LIBRARY_POSTGRES_PASSWORD:?LIBRARY_POSTGRES_PASSWORD must be set}
    volumes:
      - ./infrastructure/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      infra-net:
        aliases:
          - postgres-core
          - postgres-iam
      core-net:
        aliases:
          - postgres-core
          - dashboard-db
      app-pantry-net:
        aliases:
          - postgres-core
          - pantry-db
      app-shopping-net:
        aliases:
          - postgres-core
          - shopping-db
      app-chores-net:
        aliases:
          - postgres-core
          - chores-db
      app-maintenance-net:
        aliases:
          - postgres-core
          - maintenance-db
      app-budget-net:
        aliases:
          - postgres-core
          - budget-db
      app-chat-net:
        aliases:
          - postgres-core
          - chat-db
      app-workout-net:
        aliases:
          - postgres-core
          - workout-db
      app-library-net:
        aliases:
          - postgres-core
          - library-db
    stop_grace_period: 10s

    deploy:
      resources:
        limits:
          memory: 1g
          cpus: 1
        reservations:
          memory: 1g
          cpus: 1
  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.66.1
    container_name: alfheim_zitadel
    init: true
    restart: unless-stopped
    command: >-
      start-from-init
      --masterkey ${ZITADEL_MASTERKEY:?ZITADEL_MASTERKEY must be set}
      --tlsMode disabled
    environment:
      # Must match how the installer actually serves the stack: for
      # --tls internal that is plain HTTP on port 80 (Secure=false), and a
      # hardcoded "true" here made Zitadel advertise an issuer no client was
      # configured with, breaking every login (issue #452).
      ZITADEL_EXTERNALSECURE: "${ZITADEL_EXTERNALSECURE:?ZITADEL_EXTERNALSECURE must be set}"
      ZITADEL_EXTERNALDOMAIN: "${ZITADEL_EXTERNALDOMAIN:?ZITADEL_EXTERNALDOMAIN must be set}"
      ZITADEL_EXTERNALPORT: "${ZITADEL_EXTERNALPORT:?ZITADEL_EXTERNALPORT must be set}"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: "${ZITADEL_DB_HOST:?ZITADEL_DB_HOST must be set}"
      ZITADEL_DATABASE_POSTGRES_PORT: "${ZITADEL_DB_PORT:?ZITADEL_DB_PORT must be set}"
      ZITADEL_DATABASE_POSTGRES_DATABASE: "${ZITADEL_DB_NAME:?ZITADEL_DB_NAME must be set}"
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: "${ZITADEL_DB_USER:?ZITADEL_DB_USER must be set}"
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${ZITADEL_DB_PASSWORD:?ZITADEL_DB_PASSWORD must be set}"
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: "${ZITADEL_FIRSTINSTANCE_ORG_NAME:?ZITADEL_FIRSTINSTANCE_ORG_NAME must be set}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME:?ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME must be set}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:?ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD must be set}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      # The operator logs in with the e-mail they entered during setup, not a
      # guessed admin@auth.<domain> address (issue #454). Verified=true skips
      # the mail round-trip an unconfigured SMTP setup could never complete.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: "${ZITADEL_ADMIN_EMAIL:?ZITADEL_ADMIN_EMAIL must be set}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      # Machine user whose personal access token the installer's Zitadel
      # provisioning step (internal/features/provisioning) authenticates
      # with, mirroring infrastructure/compose.yml's dev setup.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: "${ZITADEL_BOOTSTRAP_USERNAME:?ZITADEL_BOOTSTRAP_USERNAME must be set}"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: "Alfheim Bootstrap"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2519-04-01T08:45:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
    volumes:
      - ./infrastructure/zitadel/machinekey:/machinekey
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: 0.5
        reservations:
          memory: 512m
          cpus: 0.5
  rustfs:
    # RustFS is the intended S3 implementation (see infrastructure/rustfs/README.md).
    # MinIO was a stand-in and its Docker Hub repo was withdrawn upstream, so
    # `minio/minio:*` is no longer pullable at all. Pinned to an explicit tag:
    # `latest` currently tracks a release candidate and would drift under CI.
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: alfheim_rustfs
    restart: unless-stopped
    # No `command:` override -- the image entrypoint starts the server using
    # RUSTFS_VOLUMES (baked in as /data). Passing MinIO's `server /data` makes
    # RustFS read `server` as an additional volume path.
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:?S3_ROOT_USER must be set}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD must be set}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: 0.5
        reservations:
          memory: 512m
          cpus: 0.5
  # ----------------------------------------------------------------------------
  # 3. OBSERVABILITY & TELEMETRY
  # ----------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - "-retentionPeriod=14d"
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-internal

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: 0.5
        reservations:
          memory: 512m
          cpus: 0.5
  victorialogs:
    image: victoriametrics/victoria-logs:v0.25.0-victorialogs
    container_name: victorialogs
    restart: unless-stopped
    command:
      - "-retentionPeriod=7d"
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability-internal

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.25
        reservations:
          memory: 256m
          cpus: 0.25
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/telemetry/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    # No healthcheck: the contrib image is a minimal/scratch-based build with no
    # shell or wget, so a CMD-SHELL probe can never succeed and only stalls
    # startup until timeout. Downstream services depend on service_started.
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
    networks:
      - observability-internal

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.25
        reservations:
          memory: 256m
          cpus: 0.25
  vector:
    image: timberio/vector:0.39.0-alpine
    container_name: vector-shipper
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/telemetry/vector/vector.toml:/etc/vector/vector.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8686/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - observability-internal

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.25
        reservations:
          memory: 256m
          cpus: 0.25
  grafana:
    image: grafana/grafana:11.0.0
    container_name: alfheim_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${NEXT_PUBLIC_FRONTEND_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Zitadel
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OIDC_CLIENT_ID:?GRAFANA_OIDC_CLIENT_ID must be set}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:?GRAFANA_OIDC_CLIENT_SECRET must be set}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL must be set}/oauth/v2/authorize
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${OIDC_INTERNAL_URL:-http://zitadel:8080}/oauth/v2/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=${OIDC_INTERNAL_URL:-http://zitadel:8080}/oidc/v1/userinfo
      # GRAFANA_SIGNOUT_REDIRECT_URL is the URL-encoded ${ALFHEIM_BASE_URL}/grafana/login,
      # rendered once by env.tmpl (Go's url.QueryEscape) instead of hardcoding
      # grafana.loegien.de here (issue #452, fact G).
      - GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL must be set}/oidc/v1/end_session?post_logout_redirect_uri=${GRAFANA_SIGNOUT_REDIRECT_URL:?GRAFANA_SIGNOUT_REDIRECT_URL must be set}
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
      - GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN=true
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway-net
      - observability-internal

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.25
        reservations:
          memory: 256m
          cpus: 0.25
  # ----------------------------------------------------------------------------
  # 4. CONTROL PLANE: DASHBOARD SERVICE
  # ----------------------------------------------------------------------------
  dashboard-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/dashboard-backend:${IMAGE_TAG:-latest}
    container_name: dashboard-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=${DASHBOARD_DATABASE_URL:-postgres://${DASHBOARD_POSTGRES_USER:-dashboard_user}:${DASHBOARD_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${DASHBOARD_POSTGRES_DB:-alfheim_dashboard}?sslmode=disable}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL must be set}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE must be set}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    depends_on:
      zitadel:
        condition: service_healthy
      postgres-core:
        condition: service_healthy
    networks:
      - gateway-net
      - core-net

    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.5
        reservations:
          memory: 256m
          cpus: 0.5
  dashboard-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/dashboard-frontend:${IMAGE_TAG:-latest}
    container_name: dashboard-frontend
    restart: unless-stopped
    depends_on:
      dashboard-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}}
      - NEXT_PUBLIC_OIDC_ISSUER=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL must be set}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL must be set}
      - OIDC_CLIENT_ID=${ALFHEIM_WEB_CLIENT_ID:?ALFHEIM_WEB_CLIENT_ID must be set}
      - ALFHEIM_BASE_URL=${ALFHEIM_BASE_URL:?ALFHEIM_BASE_URL must be set}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - gateway-net

    deploy:
      resources:
        limits:
          memory: 128m
          cpus: 0.25
        reservations:
          memory: 128m
          cpus: 0.25
  # ----------------------------------------------------------------------------
  # 5. CHAT ASSISTANT SERVICE
  # ----------------------------------------------------------------------------
  chat-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/chat-backend:${IMAGE_TAG:-latest}
    container_name: chat-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8080
      - DATABASE_URL=${CHAT_DATABASE_URL:-postgres://${CHAT_POSTGRES_USER:-chat_user}:${CHAT_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${CHAT_POSTGRES_DB:-alfheim_chat}?sslmode=disable}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL must be set}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?OIDC_AUDIENCE must be set}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://rustfs:9000}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}/storage}
      - CHAT_ENCRYPTION_KEY=${CHAT_ENCRYPTION_KEY:?CHAT_ENCRYPTION_KEY must be set}
      - CHAT_ENCRYPTION_KEY_ID=${CHAT_ENCRYPTION_KEY_ID:-v1}
      - CHAT_MCP_SERVERS=${CHAT_MCP_SERVERS:-pantry=http://pantry-backend:8000/mcp,chores=http://chores-backend:8000/mcp,maintenance=http://maintenance-backend:8000/mcp}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/chat/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s
    depends_on:
      zitadel:
        condition: service_healthy
      postgres-core:
        condition: service_healthy
    networks:
      - gateway-net
      - app-chat-net
      - observability-internal

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: 0.5
        reservations:
          memory: 512m
          cpus: 0.5
  chat-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/chat-frontend:${IMAGE_TAG:-latest}
    container_name: chat-frontend
    restart: unless-stopped
    depends_on:
      chat-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-${ALFHEIM_BASE_URL:-https://alfheim.loegien.de}}
      - NEXT_PUBLIC_OIDC_ISSUER=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL must be set}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL must be set}
