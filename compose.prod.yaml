      - DATABASE_URL=${WORKOUT_DATABASE_URL:-postgresql+asyncpg://${WORKOUT_POSTGRES_USER:-postgres}:${WORKOUT_POSTGRES_PASSWORD:-postgres}@workout-db:5432/${WORKOUT_POSTGRES_DB:-workout}}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/auth}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=workout-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      workout-db:
        condition: service_healthy
    networks:
      - gateway-net
      - app-workout-net
      - observability-internal

  workout-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-kroegerleif/alfheim}/workout-frontend:${IMAGE_TAG:-latest}
    container_name: workout-frontend
    restart: unless-stopped
    depends_on:
      workout-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/workout/de || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net

  # ----------------------------------------------------------------------------
  # 12. MEDIA LIBRARY SERVICE
  # ----------------------------------------------------------------------------
  library-db:
    image: postgres:16-alpine
    container_name: library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LIBRARY_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LIBRARY_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${LIBRARY_POSTGRES_DB:-library}
    volumes:
      - postgres_data_library:/var/lib/postgresql/data
