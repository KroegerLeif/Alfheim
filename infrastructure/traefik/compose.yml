services:
  traefik:
    image: traefik:v3.6.1
    container_name: alfheim_traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=public-ingress"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.maxHeaderBytes=1048576"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    environment:
      - DOCKER_API_VERSION=1.40
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./dynamic:/etc/traefik/dynamic:ro"
    networks:
      - public-ingress

networks:
  public-ingress:
    name: public-ingress
    external: true
