# Bounded json-file logs so a chatty container cannot fill the local disk
# during long sessions (the default driver keeps unbounded logs).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.8
    container_name: alfheim_caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Static page for a stopped or missing app (handle_errors in the Caddyfile).
      - ./errors:/srv/alfheim-errors:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/livez || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      gateway-net:
        # Backends resolve the public OIDC issuer host to Caddy so that
        # {OIDC_ISSUER_URL}/.well-known/openid-configuration is reachable
        # from inside the Docker network (see AGENTS.md, Backend and security).
        aliases:
          - auth.alfheim.loegien.localhost
          - auth.loegien.de

volumes:
  caddy_data:
  caddy_config:

networks:
  gateway-net:
    name: gateway-net
    external: true
