# infrastructure/telemetry/vector/vector.toml
# Log collector and parser for Alfheim Docker containers

[sources.docker_socket]
type = "docker_logs"
exclude_containers = ["vector-shipper"]

[transforms.process_and_parse_logs]
type = "remap"
inputs = ["docker_socket"]
source = '''
# 1. Parse JSON logs from applications if possible
# (Pantry, Shopping, Chores, Maintenance, Dashboard log in structured JSON)
msg_str = string!(.message)
if parsed, err = parse_json(msg_str); err == null {
  # Merge parsed attributes into root structure
  . = merge(., parsed)
  .parsed_as_json = true
} else {
  .parsed_as_json = false
}

# 2. Extract standard log metadata and normalize fields
.service_name = .container_name

# Normalize Log Severity Level
if .level != null {
  .severity = downcase!(string!(.level))
} else if .severity != null {
  .severity = downcase!(string!(.severity))
} else {
  .severity = "info"
}

# Preserve standard container attributes
.container_metadata = {
  "id": .container_id,
  "image": .image,
  "created_at": .container_created_at
}

# Clean up raw/redundant properties
del(.container_id)
del(.container_created_at)
del(.image)
'''

[sinks.otel_collector_logs]
type = "opentelemetry"
inputs = ["process_and_parse_logs"]

[sinks.otel_collector_logs.protocol]
type = "http"
uri = "http://otel-collector:4318/v1/logs"

[sinks.otel_collector_logs.encoding]
codec = "otlp"

[sinks.otel_collector_logs.batch]
max_events = 500
timeout_secs = 1
