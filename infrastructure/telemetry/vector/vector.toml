# infrastructure/telemetry/vector/vector.toml
# Log collector and parser for Alfheim Docker containers

[api]
enabled = true
address = "127.0.0.1:8686"

[sources.docker_socket]
type = "docker_logs"
exclude_containers = ["vector-shipper"]
# Reads through the read-only socket proxy on the internal docker-proxy-net,
# never the raw docker.sock (see docker-socket-proxy in compose files).
docker_host = "tcp://docker-socket-proxy:2375"

[sources.docker_socket.multiline]
start_pattern = '^[^\s\t]'
condition_pattern = '^[\s\t]+|^\tat|^(Traceback \(most recent call last\):)'
mode = "continue_through"
timeout_ms = 1000

[transforms.process_and_parse_logs]
type = "remap"
inputs = ["docker_socket"]
source = '''
# 1. Parse JSON logs from applications if possible
# (Pantry, Shopping, Chores, Maintenance, Dashboard log in structured JSON)
parsed, err = parse_json(string!(.message))
if err == null {
  ., err = merge(., parsed)
  .parsed_as_json = true
} else {
  .parsed_as_json = false
}

# 2. Extract standard log metadata and normalize fields
.service_name = .container_name

# Normalize msg and message fields (map "msg" -> "message" if missing or from JSON)
if .msg != null {
  if .parsed_as_json == true || .message == null {
    .message = string!(.msg)
  }
  del(.msg)
}

# Normalize Log Severity Level across Go slog, Python, and third-party containers
log_level = null
if .level != null {
  log_level = string!(.level)
} else if .severity != null {
  log_level = string!(.severity)
} else if .log_level != null {
  log_level = string!(.log_level)
  del(.log_level)
} else if .loglevel != null {
  log_level = string!(.loglevel)
  del(.loglevel)
}

if log_level != null {
  log_level = downcase!(log_level)
  if log_level == "warn" || log_level == "warning" {
    log_level = "warn"
  } else if log_level == "err" || log_level == "error" {
    log_level = "error"
  } else if log_level == "dbg" || log_level == "debug" {
    log_level = "debug"
  } else if log_level == "info" || log_level == "informational" {
    log_level = "info"
  } else if log_level == "crit" || log_level == "critical" || log_level == "fatal" {
    log_level = "fatal"
  }
  .severity = log_level
  .level = log_level
} else {
  .severity = "info"
  .level = "info"
}

# Preserve standard container attributes
.container_metadata = {
  "id": .container_id,
  "image": .image,
  "created_at": .container_created_at
}

# Clean up raw/redundant properties
del(.container_id)
del(.container_created_at)
del(.image)
'''

# Ship straight to VictoriaLogs' JSON lines API. The collector's OTLP /v1/logs
# endpoint only accepts OTLP payloads and answered every batch of Vector's own
# event JSON with 400 Bad Request, so no container log ever reached VictoriaLogs.
[sinks.victorialogs]
type = "http"
inputs = ["process_and_parse_logs"]
uri = "http://victorialogs:9428/insert/jsonline?_stream_fields=service_name&_msg_field=message&_time_field=timestamp"
encoding.codec = "json"
framing.method = "newline_delimited"

[sinks.victorialogs.batch]
max_events = 500
timeout_secs = 1
