# infrastructure/telemetry/grafana/grafana.ini
# Grafana configuration for Alfheim Observability

[server]
http_port = 3000
domain = api.alfheim.loegien.localhost
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
admin_password = admin
allow_embedding = true
cookie_secure = false
cookie_samesite = lax

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[auth.generic_oauth]
enabled = true
name = Zitadel
allow_sign_up = true
client_id = alfheim-grafana
client_secret = alfheim-grafana-secret
scopes = openid email profile
; Browser-facing authorize endpoint uses the public issuer host (auth.loegien.de);
; back-channel token/userinfo calls target the internal Zitadel service name.
auth_url = https://auth.loegien.de/oauth/v2/authorize
token_url = http://zitadel:8080/oauth/v2/token
api_url = http://zitadel:8080/oidc/v1/userinfo
auto_login = false
use_refresh_token = true
signout_redirect_url = https://auth.loegien.de/oidc/v1/end_session?post_logout_redirect_uri=http%3A%2F%2Fapi.alfheim.loegien.localhost%2Fgrafana%2Flogin
; Fine-grained Zitadel project-role mapping is provisioned separately; unmapped
; users fall back to auto_assign_org_role above.
role_attribute_strict = false
