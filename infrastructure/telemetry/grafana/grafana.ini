# infrastructure/telemetry/grafana/grafana.ini
# Grafana configuration for Alfheim Observability

[server]
http_port = 3000
domain = api.alfheim.loegien.localhost
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[security]
admin_user = admin
admin_password = admin
allow_embedding = true
cookie_secure = false
cookie_samesite = lax

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
client_id = alfheim-grafana
client_secret = alfheim-grafana-secret
scopes = openid email profile
auth_url = http://api.alfheim.loegien.localhost/auth/realms/alfheim/protocol/openid-connect/auth
token_url = http://keycloak:8080/auth/realms/alfheim/protocol/openid-connect/token
api_url = http://keycloak:8080/auth/realms/alfheim/protocol/openid-connect/userinfo
auto_login = false
use_refresh_token = true
signout_redirect_url = http://api.alfheim.loegien.localhost/auth/realms/alfheim/protocol/openid-connect/logout?post_logout_redirect_uri=http%3A%2F%2Fapi.alfheim.loegien.localhost%2Fgrafana%2Flogin
role_attribute_path = contains(realm_access.roles[*], 'admin') && 'Admin' || contains(realm_access.roles[*], 'editor') && 'Editor' || 'Viewer'
