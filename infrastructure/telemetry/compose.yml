# infrastructure/telemetry/compose.yml
# Alfheim Observability & Monitoring Stack (VictoriaStack + OTel Collector + Vector + Grafana)

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.109.0
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - "-retentionPeriod=14d"
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - observability-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  victorialogs:
    image: victoriametrics/victoria-logs:v1.10.0
    container_name: victorialogs
    restart: unless-stopped
    command:
      - "-retentionPeriod=7d"
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - observability-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
    networks:
      - observability-internal
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:13133/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  vector:
    image: timberio/vector:0.39.0-alpine
    container_name: vector-shipper
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    networks:
      - observability-internal
    depends_on:
      otel-collector:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: alfheim_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource,victoriametrics-datasource
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M
    networks:
      - observability-internal
      - gateway-net
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy

volumes:
  victoriametrics_data:
  victorialogs_data:
  grafana_data:

networks:
  observability-internal:
    name: observability-internal
    external: true
  gateway-net:
    name: gateway-net
    external: true
