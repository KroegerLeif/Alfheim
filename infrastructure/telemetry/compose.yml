# infrastructure/telemetry/compose.yml
# Alfheim Observability & Monitoring Stack (VictoriaStack + OTel Collector + Vector + Grafana)

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.1
    container_name: victoriametrics
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:8428:8428"
    command:
      - "-retentionPeriod=14d"
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
      - ./victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - observability-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Host metrics scraped by VictoriaMetrics (same setup as compose.prod.yaml).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.disable-defaults"
      - "--collector.cpu"
      - "--collector.meminfo"
      - "--collector.filesystem"
      - "--collector.stat"
      - "--web.listen-address=:9100"
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks:
      - observability-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://127.0.0.1:9100/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    container_name: victorialogs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:9428:9428"
    command:
      - "-retentionPeriod=7d"
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - observability-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9428/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    container_name: otel-collector
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
    networks:
      - observability-internal
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy

  # Read-only Docker API gateway for Vector (same allowlist as compose.prod.yaml).
  # Vector never mounts docker.sock directly.
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: docker-socket-proxy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    # Container group must match the group that owns the host docker socket.
    user: "65534:${DOCKER_SOCKET_GID:-0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=vector-shipper"
      - "-allowhealthcheck"
      - '-allowGET=(/v[0-9.]+)?/(_ping|version|info|events|containers/json|containers/[^/]+/(json|logs))'
      - "-watchdoginterval=10"
      - "-stoponwatchdog"
      - "-shutdowngracetime=5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks:
      - docker-proxy-net

  vector:
    image: timberio/vector:0.60.0-alpine
    container_name: vector-shipper
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - observability-internal
      - docker-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8686/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      victorialogs:
        condition: service_started
      docker-socket-proxy:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.4.12
    container_name: alfheim_grafana
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_PLUGINS_PREINSTALL=victoriametrics-logs-datasource
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Zitadel
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OIDC_CLIENT_ID:-alfheim-grafana}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:-alfheim-grafana-secret}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
      # Zitadel resolves the instance from the Host header, not from how it
      # was dialled: going straight to zitadel:8080 sends "Host: zitadel:8080",
      # which matches no instance (Instance not found / 404 on token
      # exchange). Route through the same external issuer URL as AUTH_URL —
      # Grafana is already on gateway-net, which aliases ZITADEL_EXTERNALDOMAIN
      # to Caddy.
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${OIDC_ISSUER_URL:-https://auth.loegien.de}/oauth/v2/authorize
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${OIDC_ISSUER_URL:-https://auth.loegien.de}/oauth/v2/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=${OIDC_ISSUER_URL:-https://auth.loegien.de}/oidc/v1/userinfo
      - GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=${OIDC_ISSUER_URL:-https://auth.loegien.de}/oidc/v1/end_session?post_logout_redirect_uri=http%3A%2F%2Fapi.alfheim.loegien.localhost%2Fgrafana%2Flogin
      # Fine-grained Zitadel project-role mapping is provisioned separately; unmapped users fall back to auto_assign_org_role.
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
      - GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN=true
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - observability-internal
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      victoriametrics:
        condition: service_healthy
      victorialogs:
        condition: service_healthy

volumes:
  victoriametrics_data:
  victorialogs_data:
  grafana_data:

networks:
  observability-internal:
    name: observability-internal
    external: true
  gateway-net:
    name: gateway-net
    external: true
  # Private link between Vector and its Docker socket proxy only.
  docker-proxy-net:
    name: docker-proxy-net
    driver: bridge
    internal: true
