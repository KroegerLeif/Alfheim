# infrastructure/telemetry/collector/config.yaml
# OpenTelemetry Collector Contrib Configuration for Alfheim
# Receives OTLP metrics, logs, and traces and routes to VictoriaMetrics and VictoriaLogs.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  # Metrics -> VictoriaMetrics (native OTLP metrics ingestion)
  otlphttp/victoriametrics:
    endpoint: http://victoriametrics:8428
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
    compression: gzip
    encoding: proto

  # Logs -> VictoriaLogs (native OTLP logs ingestion with stream headers)
  otlphttp/victorialogs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    headers:
      VL-Stream-Fields: "service_name,severity,job,environment"
      VL-Msg-Field: "body"
    compression: gzip

  # Traces -> Debug exporter (pluggable placeholder ready for Tempo/Jaeger)
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victoriametrics]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victorialogs]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
