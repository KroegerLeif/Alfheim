# infrastructure/compose.yml
name: alfheim-iam

services:
  postgres-iam:
    image: postgres:16-alpine
    container_name: alfheim_postgres_iam
    restart: unless-stopped
    env_file:
      - ./postgres-iam/.env
    volumes:
      - ./postgres-iam/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfheim_admin -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infra-net
    stop_grace_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: alfheim_keycloak
    init: true
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - ./keycloak/.env
    environment:
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY: "edge"
      KC_HOSTNAME_URL: "http://api.alfheim.loegien.localhost/auth"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      retries: 15
      start_period: 45s
    volumes:
      - ./keycloak/alfheim-realm.json:/opt/keycloak/data/import/alfheim-realm.json:ro
    depends_on:
      postgres-iam:
        condition: service_healthy
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: alfheim_rustfs
    restart: unless-stopped
    env_file:
      - ./rustfs/.env
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:-minioadmin}
      MINIO_ROOT_USER: ${S3_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:-minioadmin}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

volumes:
  rustfs_data:

networks:
  infra-net:
    name: infra-net
    external: true
  gateway-net:
    name: gateway-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
