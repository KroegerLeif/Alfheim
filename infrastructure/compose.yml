# infrastructure/compose.yml
name: alfheim-iam

services:
  postgres-iam:
    image: postgres:16-alpine
    container_name: alfheim_postgres_iam
    restart: unless-stopped
    env_file:
      - ./postgres-iam/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfheim_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secret_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-keycloak_db}
    volumes:
      - ./postgres-iam/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfheim_admin} -d ${POSTGRES_DB:-keycloak_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infra-net
    stop_grace_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: alfheim_keycloak
    init: true
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - ./keycloak/.env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://postgres-iam:5432/${POSTGRES_DB:-keycloak_db}}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-${POSTGRES_USER:-alfheim_admin}}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-${POSTGRES_PASSWORD:-super_secret_local_password}}
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY: "edge"
      KC_HOSTNAME_URL: "${KEYCLOAK_PUBLIC_URL:-http://api.alfheim.loegien.localhost/auth}"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-noreply@alfheim.local}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      retries: 15
      start_period: 45s
    volumes:
      - ./keycloak/alfheim-realm.json:/opt/keycloak/data/import/alfheim-realm.json:ro
      - ./keycloak/theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/alfheim-theme.jar:ro
    depends_on:
      postgres-iam:
        condition: service_healthy
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: alfheim_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 5s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: alfheim_rustfs
    restart: unless-stopped
    env_file:
      - ./rustfs/.env
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:-minioadmin}
      MINIO_ROOT_USER: ${S3_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:-minioadmin}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

volumes:
  rustfs_data:

networks:
  infra-net:
    name: infra-net
    external: true
  gateway-net:
    name: gateway-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
