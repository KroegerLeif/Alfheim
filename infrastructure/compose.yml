# infrastructure/compose.yml
name: loeger-os-iam

services:
  postgres-iam:
    image: postgres:16-alpine
    container_name: loeger_postgres_iam
    restart: unless-stopped
    env_file:
      - ./postgres-iam/.env
    volumes:
      - ./postgres-iam/data:/var/lib/postgresql/data
    networks:
      - iam_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: loeger_keycloak
    restart: unless-stopped
    command: start-dev
    env_file:
      - ./keycloak/.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres-iam
    networks:
      - iam_network

networks:
  iam_network:
    driver: bridge