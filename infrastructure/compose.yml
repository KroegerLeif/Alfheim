# infrastructure/compose.yml
name: loeger-os-iam

services:
  postgres-iam:
    image: postgres:16-alpine
    container_name: loeger_postgres_iam
    restart: unless-stopped
    env_file:
      - ./postgres-iam/.env
    volumes:
      - ./postgres-iam/data:/var/lib/postgresql/data
    networks:
      - iam_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: loeger_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - ./keycloak/.env
    environment:
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY: "edge"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./keycloak/loeger-os-realm.json:/opt/keycloak/data/import/loeger-os-realm.json:ro
    depends_on:
      - postgres-iam
    networks:
      - iam_network
      - loeger-os-network

  gateway:
    image: nginx:alpine
    container_name: loeger_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak
    networks:
      - iam_network
      - loeger-os-network

networks:
  iam_network:
    driver: bridge
  loeger-os-network:
    name: loeger-os-network
    external: true