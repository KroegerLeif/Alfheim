# infrastructure/compose.yml
name: loeger-os-iam

services:
  postgres-iam:
    image: postgres:16-alpine
    container_name: loeger_postgres_iam
    restart: unless-stopped
    env_file:
      - ./postgres-iam/.env
    volumes:
      - ./postgres-iam/data:/var/lib/postgresql/data
    networks:
      - iam_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: loeger_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    env_file:
      - ./keycloak/.env
    environment:
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY: "edge"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./keycloak/loeger-os-realm.json:/opt/keycloak/data/import/loeger-os-realm.json:ro
    depends_on:
      - postgres-iam
    networks:
      - iam_network
      - public-ingress
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`loeger-os`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.service=keycloak-service"
      - "traefik.http.services.keycloak-service.loadbalancer.server.port=8080"

  traefik:
    image: traefik:v3.6.1
    container_name: loeger_traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=public-ingress"
      - "--entrypoints.web.address=:80"
    environment:
      - DOCKER_API_VERSION=1.40
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - public-ingress

networks:
  iam_network:
    driver: bridge
  # public-ingress is owned by this compose — all other stacks reference it as external
  public-ingress:
    name: public-ingress
  # observability-internal is owned by the logging-stack — declare as external to prevent accidental teardown
  observability-internal:
    name: observability-internal
    external: true