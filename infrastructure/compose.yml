# infrastructure/compose.yml
name: alfheim-iam

services:
  postgres-core:
    image: postgres:16-alpine
    container_name: alfheim_postgres_core
    restart: unless-stopped
    env_file:
      - path: ./postgres/.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secret_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      ZITADEL_DB_USER: ${ZITADEL_DB_USER:-zitadel_user}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:-postgres}
      DASHBOARD_POSTGRES_USER: ${DASHBOARD_POSTGRES_USER:-dashboard_user}
      DASHBOARD_POSTGRES_PASSWORD: ${DASHBOARD_POSTGRES_PASSWORD:-postgres}
      PANTRY_POSTGRES_USER: ${PANTRY_POSTGRES_USER:-pantry_user}
      PANTRY_POSTGRES_PASSWORD: ${PANTRY_POSTGRES_PASSWORD:-postgres}
      SHOPPING_POSTGRES_USER: ${SHOPPING_POSTGRES_USER:-shopping_user}
      SHOPPING_POSTGRES_PASSWORD: ${SHOPPING_POSTGRES_PASSWORD:-postgres}
      MAINTENANCE_POSTGRES_USER: ${MAINTENANCE_POSTGRES_USER:-maintenance_user}
      MAINTENANCE_POSTGRES_PASSWORD: ${MAINTENANCE_POSTGRES_PASSWORD:-postgres}
      CHORES_POSTGRES_USER: ${CHORES_POSTGRES_USER:-chores_user}
      CHORES_POSTGRES_PASSWORD: ${CHORES_POSTGRES_PASSWORD:-postgres}
      BUDGET_POSTGRES_USER: ${BUDGET_POSTGRES_USER:-budget_user}
      BUDGET_POSTGRES_PASSWORD: ${BUDGET_POSTGRES_PASSWORD:-postgres}
      CHAT_POSTGRES_USER: ${CHAT_POSTGRES_USER:-chat_user}
      CHAT_POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:-postgres}
      WORKOUT_POSTGRES_USER: ${WORKOUT_POSTGRES_USER:-workout_user}
      WORKOUT_POSTGRES_PASSWORD: ${WORKOUT_POSTGRES_PASSWORD:-postgres}
      LIBRARY_POSTGRES_USER: ${LIBRARY_POSTGRES_USER:-library_user}
      LIBRARY_POSTGRES_PASSWORD: ${LIBRARY_POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infra-net
      - core-net
      - app-pantry-net
      - app-shopping-net
      - app-chores-net
      - app-maintenance-net
      - app-budget-net
      - app-chat-net
      - app-workout-net
      - app-library-net
    stop_grace_period: 10s

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.66.1
    container_name: alfheim_zitadel
    init: true
    restart: unless-stopped
    command: >-
      start-from-init
      --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
      --tlsMode disabled
    environment:
      # --- External addressing (issuer) ---
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: "${ZITADEL_EXTERNALDOMAIN:-auth.alfheim.loegien.localhost}"
      ZITADEL_EXTERNALPORT: "${ZITADEL_EXTERNALPORT:-80}"
      ZITADEL_TLS_ENABLED: "false"
      # --- PostgreSQL connection (application user) ---
      ZITADEL_DATABASE_POSTGRES_HOST: "${ZITADEL_DB_HOST:-postgres-core}"
      ZITADEL_DATABASE_POSTGRES_PORT: "${ZITADEL_DB_PORT:-5432}"
      ZITADEL_DATABASE_POSTGRES_DATABASE: "${ZITADEL_DB_NAME:-zitadel}"
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: "${ZITADEL_DB_USER:-zitadel_user}"
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: "${ZITADEL_DB_PASSWORD:-postgres}"
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      # --- PostgreSQL connection (admin user, runs setup migrations) ---
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: "${POSTGRES_USER:-postgres}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: "${POSTGRES_PASSWORD:-super_secret_local_password}"
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # --- First instance bootstrap (initial organisation & admin human user) ---
      ZITADEL_FIRSTINSTANCE_ORG_NAME: "${ZITADEL_FIRSTINSTANCE_ORG_NAME:-Alfheim}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME:-admin}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:-Password1!}"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # --- First instance bootstrap (machine user used to provision clients) ---
      # Zitadel ships no admin CLI, so scripts/zitadel-bootstrap.sh provisions
      # OIDC clients through the Management API instead. Its bearer token is
      # the personal access token Zitadel writes to PATPATH while creating the
      # first instance. Local development only.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: "${ZITADEL_BOOTSTRAP_USERNAME:-bootstrap}"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: "Alfheim Bootstrap"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2519-04-01T08:45:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
    volumes:
      - ./zitadel/machinekey:/machinekey
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: alfheim_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 5s

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: alfheim_rustfs
    restart: unless-stopped
    env_file:
      - path: ./rustfs/.env
        required: false
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:-minioadmin}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - infra-net
      - gateway-net
    stop_grace_period: 10s

volumes:
  rustfs_data:

networks:
  infra-net:
    name: infra-net
    external: true
  core-net:
    name: core-net
    external: true
  app-pantry-net:
    name: app-pantry-net
    external: true
  app-shopping-net:
    name: app-shopping-net
    external: true
  app-chores-net:
    name: app-chores-net
    external: true
  app-maintenance-net:
    name: app-maintenance-net
    external: true
  app-budget-net:
    name: app-budget-net
    external: true
  app-chat-net:
    name: app-chat-net
    external: true
  app-workout-net:
    name: app-workout-net
    external: true
  app-library-net:
    name: app-library-net
    external: true
  gateway-net:
    name: gateway-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
