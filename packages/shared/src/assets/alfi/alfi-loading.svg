      <stop offset="100%" stop-color="#0b1326" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="body-grad-loading" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a47" />
      <stop offset="100%" stop-color="#071728" />
