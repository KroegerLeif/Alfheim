[project]
name = "backend-shared"
version = "0.1.0"
description = "Shared backend infrastructure library for Alfheim microservices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=13.0.0",
    "alembic>=1.13.0",
    "fastapi>=0.128.8",
    "fastmcp>=4.1.5",
    "certifi>=2024.2.2",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.11.0",
    "pyjwt[crypto]>=2.15.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.38",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
]

[project.optional-dependencies]
# Image uploads (backend_shared.images). Optional so backends without image
# handling do not carry Pillow in their container images.
images = [
    "pillow>=11.0.0",
    "pillow-heif>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
