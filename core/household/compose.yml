# core/household/compose.yml — local development stack for the Tier-1
# household app (households, memberships, profile). Included from the root
# compose.yaml and started by scripts/up.sh right after the dashboard.
services:
  # One-shot: creates the household database and its least-privilege user on
  # postgres-core. infrastructure/postgres/init-multiple-dbs.sh only runs when
  # the Postgres data directory is empty, so a dev machine whose database
  # predates the household app would otherwise never get alfheim_household.
  # Idempotent; the password is re-applied on every run so it follows .env.
  household-db-init:
    image: postgres:16-alpine
    container_name: household-db-init
    restart: "no"
    environment:
      PGHOST: postgres-core
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-super_secret_local_password}
      PGDATABASE: postgres
      HOUSEHOLD_DB: ${HOUSEHOLD_POSTGRES_DB:-alfheim_household}
      HOUSEHOLD_USER: ${HOUSEHOLD_POSTGRES_USER:-household_user}
      HOUSEHOLD_PASSWORD: ${HOUSEHOLD_POSTGRES_PASSWORD:-postgres}
    command:
      - sh
      - -euc
      - |
        psql -v ON_ERROR_STOP=1 -v u="$$HOUSEHOLD_USER" -v p="$$HOUSEHOLD_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'u')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'u') \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'u', :'p') \gexec
        SQL
        psql -v ON_ERROR_STOP=1 -v d="$$HOUSEHOLD_DB" -v u="$$HOUSEHOLD_USER" <<'SQL'
        SELECT format('CREATE DATABASE %I OWNER %I', :'d', :'u')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'d') \gexec
        SELECT format('ALTER DATABASE %I OWNER TO %I', :'d', :'u') \gexec
        SQL
        psql -v ON_ERROR_STOP=1 -d "$$HOUSEHOLD_DB" -v u="$$HOUSEHOLD_USER" <<'SQL'
        SELECT format('ALTER SCHEMA public OWNER TO %I', :'u') \gexec
        SQL
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - core-net

  household-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: household-backend
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=${HOUSEHOLD_DATABASE_URL:-postgres://${HOUSEHOLD_POSTGRES_USER:-household_user}:${HOUSEHOLD_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${HOUSEHOLD_POSTGRES_DB:-alfheim_household}?sslmode=disable}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-http://auth.alfheim.loegien.localhost}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-alfheim}
      # Plain HTTP in development: no private CA to trust.
      - ALFHEIM_EXTRA_CA_FILE=
      # Shared secret for service-to-service calls on /internal/* (never
      # routed by Caddy). Generated by scripts/init-env.sh.
      - ALFHEIM_INTERNAL_TOKEN=${ALFHEIM_INTERNAL_TOKEN:-dev-internal-token-change-me}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres-core:
        condition: service_healthy
      household-db-init:
        condition: service_completed_successfully
    networks:
      - gateway-net
      - core-net

  household-frontend:
    build:
      context: ../..
      dockerfile: core/household/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${ALFHEIM_BASE_URL:-http://alfheim.loegien.localhost}/api/v1
        - NEXT_PUBLIC_OIDC_ISSUER=${NEXT_PUBLIC_OIDC_ISSUER:-http://auth.alfheim.loegien.localhost}
        - NEXT_PUBLIC_OIDC_CLIENT_ID=${NEXT_PUBLIC_OIDC_CLIENT_ID:-household-frontend}
        - NEXT_PUBLIC_OIDC_REDIRECT_URI=${NEXT_PUBLIC_HOUSEHOLD_OIDC_REDIRECT_URI:-http://alfheim.loegien.localhost/household/}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: household-frontend
    restart: always
    depends_on:
      household-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
      # Served at request time by <basePath>/runtime-config.js
      # (packages/shared/src/features/auth/runtimeConfigHandler.ts).
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-http://auth.alfheim.loegien.localhost}
      - OIDC_CLIENT_ID=${ALFHEIM_WEB_CLIENT_ID:-}
      - ALFHEIM_BASE_URL=${ALFHEIM_BASE_URL:-http://alfheim.loegien.localhost}
      - NEXT_PUBLIC_API_URL=${ALFHEIM_BASE_URL:-http://alfheim.loegien.localhost}/api/v1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/household', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway-net

networks:
  gateway-net:
    name: gateway-net
    external: true
  core-net:
    name: core-net
    external: true
