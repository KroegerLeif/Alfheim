services:
  dashboard-db:
    image: postgres:16-alpine
    container_name: dashboard-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard_db
    volumes:
      - dashboard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - core-net
    stop_grace_period: 10s

  dashboard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-backend
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@dashboard-db:5432/dashboard_db?sslmode=disable
      - KEYCLOAK_BASE_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=alfheim
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      dashboard-db:
        condition: service_healthy
    networks:
      - gateway-net
      - core-net

  dashboard-frontend:
    build:
      context: ../../..
      dockerfile: core/dashboard/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_DASHBOARD_API_URL:-http://api.alfheim.loegien.localhost/api/v1}
        - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-http://api.alfheim.loegien.localhost/auth}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: dashboard-frontend
    restart: always
    depends_on:
      dashboard-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net

volumes:
  dashboard_postgres_data:

networks:
  gateway-net:
    name: gateway-net
    external: true
  core-net:
    name: core-net
    external: true

