# Dependabot does not update the `rev` pins below; bump them by hand. Keep the
# ruff rev equal to the ruff version locked in uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^apps/.*/templates/
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: python-ty-check
        name: Python Type Check (ty)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        verbose: true

      # Both Go hooks iterate over every module listed in go.work, packages/go-shared included.
      - id: go-fmt
        name: Go Format (gofmt)
        entry: bash -c 'set -e; for d in $(go list -m -f "{{.Dir}}"); do gofmt -w "$d"; done'
        language: system
        files: \.go$
        pass_filenames: false

      - id: go-vet
        name: Go Vet
        entry: bash -c 'set -e; for d in $(go list -m -f "{{.Dir}}"); do echo "go vet $d"; (cd "$d" && go vet ./...); done'
        language: system
        files: \.go$
        pass_filenames: false

      - id: frontend-prettier-lint
        name: Frontend Formatting & Linting
        entry: pnpm lint
        language: system
        files: \.(ts|tsx|js|jsx|json|css|md)$
        pass_filenames: false
