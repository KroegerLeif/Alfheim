# apps/logging-stack/compose.yml
services:
  signoz-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: signoz-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - ./keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - clickhouse_data:/var/lib/clickhouse

    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4096M
    networks:
      - observability-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  signoz-schema-migrator:
    image: signoz/signoz-schema-migrator:0.102.0
    container_name: signoz-schema-migrator
    command: ["--disable-duration-sort-feature", "--disable-timestamp-sort-feature", "--dsn=tcp://signoz-clickhouse:9000"]
    restart: "on-failure:5"
    networks:
      - observability-internal
    depends_on:
      signoz-clickhouse:
        condition: service_healthy

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.102.0

    container_name: signoz-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
    networks:
      - observability-internal
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully

  signoz:
    image: signoz/signoz:v0.133.0
    container_name: signoz-ui

    restart: unless-stopped
    environment:
      - ClickHouseUrl=tcp://signoz-clickhouse:9000?database=signoz_traces
      - SIGNOZ_GLOBAL_EXTERNAL__URL=http://alfheim/signoz
    volumes:
      - signoz_sqlite_data:/var/lib/signoz
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - observability-internal
      - public-ingress
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.signoz.rule=(Host(`alfheim`) || Host(`localhost`)) && PathPrefix(`/signoz`)"
      - "traefik.http.routers.signoz.entrypoints=web"
      - "traefik.http.routers.signoz.service=signoz-service"
      - "traefik.http.services.signoz-service.loadbalancer.server.port=8080"
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully


  vector:
    image: timberio/vector:0.39.0-alpine
    container_name: vector-shipper
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
    networks:
      - observability-internal
    depends_on:
      - signoz-otel-collector

volumes:
  clickhouse_data:
  signoz_sqlite_data:

networks:
  # observability-internal network reference
  observability-internal:
    name: observability-internal
    external: true
  # public-ingress is owned by infrastructure/compose.yml — reference as external only
  public-ingress:
    name: public-ingress
    external: true
