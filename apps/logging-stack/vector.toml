# apps/logging-stack/vector.toml

[sources.docker_socket]
type = "docker_logs"
# Exclude Vector itself to prevent loops and noise
exclude_containers = ["vector-shipper"]

[transforms.process_and_parse_logs]
type = "remap"
inputs = ["docker_socket"]
source = '''
# 1. Parse JSON logs from applications if possible
# (Pantry/Shopping python apps log in structured JSON stdout formats)
msg_str = string!(.message)
if parsed, err = parse_json(msg_str); err == null {
  # Merge parsed attributes into the root event structure
  . = merge(., parsed)
  .parsed_as_json = true
} else {
  .parsed_as_json = false
}

# 2. Extract standard log metadata and normalize fields
.service_name = .container_name

# Normalize Log Severity Level
if .level != null {
  .severity = downcase!(string!(.level))
} else if .severity != null {
  .severity = downcase!(string!(.severity))
} else {
  .severity = "info"
}

# Preserve standard attributes in structured format
.container_metadata = {
  "id": .container_id,
  "image": .image,
  "created_at": .container_created_at
}

# Clean up raw or temporal properties to optimize storage
del(.container_id)
del(.container_created_at)
del(.image)
'''

[sinks.signoz_otel_sink]
type = "opentelemetry"
inputs = ["process_and_parse_logs"]

[sinks.signoz_otel_sink.protocol]
type = "http"
# Forward specifically to the OTel Collector HTTP port for logs
uri = "http://signoz-otel-collector:4318/v1/logs"

[sinks.signoz_otel_sink.encoding]
codec = "otlp"

[sinks.signoz_otel_sink.batch]
max_events = 500
timeout_secs = 1
