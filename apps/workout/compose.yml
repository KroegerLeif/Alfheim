services:
  workout-db:
    image: postgres:16-alpine
    container_name: workout-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workout
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_workout:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workout"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-workout-net
    stop_grace_period: 10s

  workout-backend:
    build:
      context: ../..
      dockerfile: apps/workout/backend/Dockerfile
    container_name: workout-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@workout-db:5432/workout
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=workout-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      workout-db:
        condition: service_healthy
    networks:
      - gateway-net
      - app-workout-net
      - observability-internal

volumes:
  postgres_data_workout:

networks:
  gateway-net:
    name: gateway-net
    external: true
  app-workout-net:
    name: app-workout-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
