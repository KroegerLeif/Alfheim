services:
  shopping-db:
    image: postgres:16-alpine
    container_name: shopping-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_shopping:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopping-internal

  shopping-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopping-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@shopping-db:5432/shopping
      - PANTRY_BACKEND_URL=http://pantry-backend:8000
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=shopping-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      shopping-db:
        condition: service_healthy
    networks:
      - public-ingress
      - shopping-internal
      - observability-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shopping-backend.rule=Host(`loeger-os`) && PathPrefix(`/api/v1/shopping`)"
      - "traefik.http.routers.shopping-backend.entrypoints=web"
      - "traefik.http.routers.shopping-backend.middlewares=shopping-api-replace"
      - "traefik.http.routers.shopping-backend.service=shopping-backend-service"
      - "traefik.http.middlewares.shopping-api-replace.replacepathregex.regex=^/api/v1/shopping/(api/v1/)?(.*)"
      - "traefik.http.middlewares.shopping-api-replace.replacepathregex.replacement=/api/v1/$$2"
      - "traefik.http.services.shopping-backend-service.loadbalancer.server.port=8000"

  shopping-frontend:
    build:
      context: ../..
      dockerfile: apps/shopping/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1/shopping}
        - NEXT_PUBLIC_PANTRY_API_URL=${NEXT_PUBLIC_PANTRY_API_URL:-/api/v1/pantry}
    container_name: shopping-frontend
    restart: always
    env_file:
      - .env
    depends_on:
      shopping-backend:
        condition: service_healthy
    environment:
      - PORT=3010
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3010/shopping/en || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - public-ingress
    labels:
      - "traefik.enable=true"
      # Catch-all router for standard subpath asset routing (e.g., /shopping/en, /shopping/_next/...)
      - "traefik.http.routers.shopping-frontend.rule=Host(`loeger-os`) && PathPrefix(`/shopping`)"
      - "traefik.http.routers.shopping-frontend.entrypoints=web"
      - "traefik.http.routers.shopping-frontend.service=shopping-frontend-service"
      
      # Explicit router for root/basePath direct hits
      - "traefik.http.routers.shopping-exact.rule=Host(`loeger-os`) && (Path(`/shopping`) || Path(`/shopping/`))"
      - "traefik.http.routers.shopping-exact.entrypoints=web"
      - "traefik.http.routers.shopping-exact.middlewares=shopping-redirect-en"
      - "traefik.http.routers.shopping-exact.service=shopping-frontend-service"
      
      # Redirect /shopping or /shopping/ directly to /shopping/en to prevent Next.js 404s
      - "traefik.http.middlewares.shopping-redirect-en.redirectregex.regex=^(https?://[^/]+)/shopping/?$$"
      - "traefik.http.middlewares.shopping-redirect-en.redirectregex.replacement=$${1}/shopping/en"
      - "traefik.http.middlewares.shopping-redirect-en.redirectregex.permanent=false"
      
      - "traefik.http.services.shopping-frontend-service.loadbalancer.server.port=3010"

volumes:
  postgres_data_shopping:

networks:
  public-ingress:
    name: public-ingress
    external: true
  shopping-internal:
    name: shopping-internal
  observability-internal:
    name: observability-internal
    external: true
