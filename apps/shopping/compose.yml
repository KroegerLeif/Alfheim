services:
  shopping-backend:
    build:
      context: ../..
      dockerfile: apps/shopping/backend/Dockerfile
    container_name: shopping-backend
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${SHOPPING_DATABASE_URL:-postgresql+asyncpg://${SHOPPING_POSTGRES_USER:-shopping_user}:${SHOPPING_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${SHOPPING_POSTGRES_DB:-alfheim_shopping}}
      - PANTRY_BACKEND_URL=${PANTRY_BACKEND_URL:-http://pantry-backend:8000}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-http://auth.alfheim.loegien.localhost}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-alfheim}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=shopping-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - gateway-net
      - app-shopping-net
      - observability-internal

  shopping-frontend:
    build:
      context: ../..
      dockerfile: apps/shopping/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_SHOPPING_API_URL:-http://api.alfheim.loegien.localhost/shopping/api/v1}
        - NEXT_PUBLIC_PANTRY_API_URL=${NEXT_PUBLIC_PANTRY_API_URL:-http://api.alfheim.loegien.localhost/pantry/api/v1}
        - NEXT_PUBLIC_OIDC_ISSUER=${NEXT_PUBLIC_OIDC_ISSUER:-http://auth.alfheim.loegien.localhost}
        - NEXT_PUBLIC_OIDC_CLIENT_ID=${NEXT_PUBLIC_OIDC_CLIENT_ID:-shopping-frontend}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: shopping-frontend
    restart: always
    env_file:
      - path: .env
        required: false
    depends_on:
      shopping-backend:
        condition: service_healthy
    environment:
      - PORT=3010
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3010/shopping/en', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway-net

networks:
  gateway-net:
    name: gateway-net
    external: true
  app-shopping-net:
    name: app-shopping-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
