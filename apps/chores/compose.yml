services:
  chores-db:
    image: postgres:16-alpine
    container_name: chores-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chores
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_chores:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chores"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chores-internal

  chores-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chores-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@chores-db:5432/chores
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=chores-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      chores-db:
        condition: service_healthy
    networks:
      - public-ingress
      - chores-internal
      - observability-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chores-backend.rule=Host(`loeger-os`) && PathPrefix(`/api/v1/chores`)"
      - "traefik.http.routers.chores-backend.entrypoints=web"
      - "traefik.http.routers.chores-backend.middlewares=chores-api-replace"
      - "traefik.http.routers.chores-backend.service=chores-backend-service"
      - "traefik.http.middlewares.chores-api-replace.replacepathregex.regex=^/api/v1/chores/(api/v1/)?(.*)"
      - "traefik.http.middlewares.chores-api-replace.replacepathregex.replacement=/api/v1/$$2"
      - "traefik.http.services.chores-backend-service.loadbalancer.server.port=8000"

volumes:
  postgres_data_chores:

networks:
  public-ingress:
    name: public-ingress
    external: true
  chores-internal:
    name: chores-internal
  observability-internal:
    name: observability-internal
    external: true
