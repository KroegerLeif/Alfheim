services:
  chores-db:
    image: postgres:16-alpine
    container_name: chores-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chores
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_chores:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chores"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-chores-net
    stop_grace_period: 10s

  chores-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chores-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@chores-db:5432/chores
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=chores-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      chores-db:
        condition: service_healthy
    networks:
      - gateway-net
      - app-chores-net
      - observability-internal

  chores-frontend:
    build:
      context: ../..
      dockerfile: apps/chores/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_CHORES_API_URL:-http://api.alfheim.loegien.localhost/api/v1/chores}
        - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-http://api.alfheim.loegien.localhost/auth}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: chores-frontend
    restart: always
    env_file:
      - .env
    depends_on:
      chores-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/chores/de || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net

volumes:
  postgres_data_chores:

networks:
  gateway-net:
    name: gateway-net
    external: true
  app-chores-net:
    name: app-chores-net
    external: true
  observability-internal:
    name: observability-internal
    external: true

