services:
  maintenance-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maintenance-backend
    restart: always
    environment:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=maintenance-backend
    networks:
      - public-ingress
      - observability-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintenance-backend.rule=Host(`loeger-os`) && PathPrefix(`/api/v1/maintenance`)"
      - "traefik.http.routers.maintenance-backend.entrypoints=web"
      - "traefik.http.routers.maintenance-backend.middlewares=maintenance-api-replace"
      - "traefik.http.routers.maintenance-backend.service=maintenance-backend-service"
      - "traefik.http.middlewares.maintenance-api-replace.replacepathregex.regex=^/api/v1/maintenance/(api/v1/)?(.*)"
      - "traefik.http.middlewares.maintenance-api-replace.replacepathregex.replacement=/api/v1/$$2"
      - "traefik.http.services.maintenance-backend-service.loadbalancer.server.port=8000"

  maintenance-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1/maintenance}
    container_name: maintenance-frontend
    restart: always
    environment:
      - PORT=3020
    networks:
      - public-ingress
      - observability-internal
    labels:
      - "traefik.enable=true"
      # Catch-all router for standard subpath asset routing (e.g., /maintenance/en, /maintenance/_next/...)
      - "traefik.http.routers.maintenance-frontend.rule=Host(`loeger-os`) && PathPrefix(`/maintenance`)"
      - "traefik.http.routers.maintenance-frontend.entrypoints=web"
      - "traefik.http.routers.maintenance-frontend.service=maintenance-frontend-service"
      
      # Explicit router for root/basePath direct hits
      - "traefik.http.routers.maintenance-exact.rule=Host(`loeger-os`) && (Path(`/maintenance`) || Path(`/maintenance/`))"
      - "traefik.http.routers.maintenance-exact.entrypoints=web"
      - "traefik.http.routers.maintenance-exact.middlewares=maintenance-redirect-en"
      - "traefik.http.routers.maintenance-exact.service=maintenance-frontend-service"
      
      # Redirect /maintenance or /maintenance/ directly to /maintenance/en to prevent Next.js 404s
      - "traefik.http.middlewares.maintenance-redirect-en.redirectregex.regex=^http://loeger-os/maintenance/?$$"
      - "traefik.http.middlewares.maintenance-redirect-en.redirectregex.replacement=http://loeger-os/maintenance/en"
      
      - "traefik.http.services.maintenance-frontend-service.loadbalancer.server.port=3020"

networks:
  public-ingress:
    name: public-ingress
  observability-internal:
    name: observability-internal
