services:
  maintenance-db:
    image: postgres:16-alpine
    container_name: maintenance-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintenance
    volumes:
      - maintenance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - maintenance-internal
    stop_grace_period: 10s

  maintenance-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maintenance-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@maintenance-db:5432/maintenance
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=maintenance-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      maintenance-db:
        condition: service_healthy
    networks:
      - public-ingress
      - maintenance-internal
      - observability-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintenance-backend.rule=(Host(`alfheim`) || Host(`localhost`)) && PathPrefix(`/api/v1/maintenance`)"
      - "traefik.http.routers.maintenance-backend.entrypoints=web"
      - "traefik.http.routers.maintenance-backend.middlewares=maintenance-api-replace"
      - "traefik.http.routers.maintenance-backend.service=maintenance-backend-service"
      - "traefik.http.middlewares.maintenance-api-replace.replacepathregex.regex=^/api/v1/maintenance/(api/v1/)?(.*)"
      - "traefik.http.middlewares.maintenance-api-replace.replacepathregex.replacement=/api/v1/$$2"
      - "traefik.http.services.maintenance-backend-service.loadbalancer.server.port=8000"

  maintenance-frontend:
    build:
      context: ../..
      dockerfile: apps/maintenance/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_MAINTENANCE_API_URL:-/api/v1/maintenance}
    container_name: maintenance-frontend
    restart: always
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/maintenance/en || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      maintenance-backend:
        condition: service_healthy
    networks:
      - public-ingress
      - observability-internal
    labels:
      - "traefik.enable=true"

      # --- Catch-all router: handles /maintenance/en/*, /maintenance/_next/*, etc. ---
      - "traefik.http.routers.maintenance-frontend.rule=(Host(`alfheim`) || Host(`localhost`)) && PathPrefix(`/maintenance`)"
      - "traefik.http.routers.maintenance-frontend.entrypoints=web"
      - "traefik.http.routers.maintenance-frontend.service=maintenance-frontend-service"

      # --- Exact router: catches /maintenance and /maintenance/ and redirects to /en ---
      - "traefik.http.routers.maintenance-exact.rule=(Host(`alfheim`) || Host(`localhost`)) && (Path(`/maintenance`) || Path(`/maintenance/`))"
      - "traefik.http.routers.maintenance-exact.entrypoints=web"
      - "traefik.http.routers.maintenance-exact.middlewares=maintenance-redirect-en"
      - "traefik.http.routers.maintenance-exact.service=maintenance-frontend-service"

      # --- Redirect middleware: 302 to /maintenance/en (non-permanent avoids browser caching a bad redirect) ---
      - "traefik.http.middlewares.maintenance-redirect-en.redirectregex.regex=^(https?://[^/]+)/maintenance/?$$"
      - "traefik.http.middlewares.maintenance-redirect-en.redirectregex.replacement=$${1}/maintenance/en"
      - "traefik.http.middlewares.maintenance-redirect-en.redirectregex.permanent=false"

      # --- Service: port matches Dockerfile EXPOSE and container PORT env variable ---
      - "traefik.http.services.maintenance-frontend-service.loadbalancer.server.port=3000"

volumes:
  maintenance_postgres_data:

networks:
  public-ingress:
    name: public-ingress
    external: true
  maintenance-internal:
    name: maintenance-internal
  observability-internal:
    name: observability-internal
    external: true
