services:
  maintenance-db:
    image: postgres:16-alpine
    container_name: maintenance-db
    restart: always
    environment:
      POSTGRES_USER: ${MAINTENANCE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MAINTENANCE_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${MAINTENANCE_POSTGRES_DB:-maintenance}
    volumes:
      - maintenance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAINTENANCE_POSTGRES_USER:-postgres} -d ${MAINTENANCE_POSTGRES_DB:-maintenance}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-maintenance-net
    stop_grace_period: 10s

  maintenance-backend:
    build:
      context: ../..
      dockerfile: apps/maintenance/backend/Dockerfile
    container_name: maintenance-backend
    restart: always
    environment:
      - DATABASE_URL=${MAINTENANCE_DATABASE_URL:-postgresql+asyncpg://${MAINTENANCE_POSTGRES_USER:-postgres}:${MAINTENANCE_POSTGRES_PASSWORD:-postgres}@maintenance-db:5432/${MAINTENANCE_POSTGRES_DB:-maintenance}}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/auth}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=maintenance-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      maintenance-db:
        condition: service_healthy
    networks:
      - gateway-net
      - app-maintenance-net
      - observability-internal

  maintenance-frontend:
    build:
      context: ../..
      dockerfile: apps/maintenance/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_MAINTENANCE_API_URL:-http://api.alfheim.loegien.localhost/maintenance/api/v1}
        - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-http://api.alfheim.loegien.localhost/auth}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: maintenance-frontend
    restart: always
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/maintenance/en', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      maintenance-backend:
        condition: service_healthy
    networks:
      - gateway-net
      - observability-internal

volumes:
  maintenance_postgres_data:

networks:
  gateway-net:
    name: gateway-net
    external: true
  app-maintenance-net:
    name: app-maintenance-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
