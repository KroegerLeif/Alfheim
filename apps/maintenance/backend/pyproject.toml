[project]
name = "maintenance-backend"
version = "0.1.0"
description = "Backend microservice for the alfheim Maintenance application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.128.8",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.11.0",
    "pyjwt[crypto]>=2.8.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.39.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "mcp[cli]>=1.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
