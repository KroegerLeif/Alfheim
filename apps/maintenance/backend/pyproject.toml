[project]
name = "maintenance-backend"
version = "0.1.0"
description = "Backend microservice for the alfheim Maintenance application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backend-shared",
    "alembic>=1.13.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.8",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.39.0",
    "httpx>=0.28.1",
    "fastmcp>=3.4.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
    "ty>=0.0.72",
]

[tool.uv.sources]
backend-shared = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov-fail-under=95"

[tool.coverage.run]
source = ["app"]
omit = [
    "**/mcp_tools.py",
    "**/seeder.py",
    "**/mcp/*",
]
