services:
  library-db:
    image: postgres:16-alpine
    container_name: library-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_library:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-library-net
    stop_grace_period: 10s

  library-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@library-db:5432/library
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=library-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      library-db:
        condition: service_healthy
    networks:
      - gateway-net
      - app-library-net
      - observability-internal

  library-frontend:
    build:
      context: ../..
      dockerfile: apps/library/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_LIBRARY_API_URL:-http://api.alfheim.loegien.localhost/api/v1/library}
        - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-http://api.alfheim.loegien.localhost/auth}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: library-frontend
    restart: always
    depends_on:
      library-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/library/en || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net

volumes:
  postgres_data_library:

networks:
  gateway-net:
    name: gateway-net
    external: true
  app-library-net:
    name: app-library-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
