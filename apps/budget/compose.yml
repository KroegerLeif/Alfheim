services:
  budget-backend:
    build:
      context: ../..
      dockerfile: apps/budget/backend/Dockerfile
    container_name: budget-backend
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${BUDGET_DATABASE_URL:-postgresql+asyncpg://${BUDGET_POSTGRES_USER:-budget_user}:${BUDGET_POSTGRES_PASSWORD:-postgres}@postgres-core:5432/${BUDGET_POSTGRES_DB:-alfheim_budget}}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-http://api.alfheim.loegien.localhost/auth}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-alfheim}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://rustfs:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-budget-receipts}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=budget-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres-core:
        condition: service_healthy
    networks:
      - gateway-net
      - app-budget-net
      - observability-internal

  budget-frontend:
    build:
      context: ../..
      dockerfile: apps/budget/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_BUDGET_API_URL:-http://api.alfheim.loegien.localhost/budget/api/v1}
        - NEXT_PUBLIC_OIDC_ISSUER=${NEXT_PUBLIC_OIDC_ISSUER:-http://api.alfheim.loegien.localhost/auth}
        - NEXT_PUBLIC_OIDC_CLIENT_ID=${NEXT_PUBLIC_OIDC_CLIENT_ID:-budget-frontend}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: budget-frontend
    restart: always
    env_file:
      - path: .env
        required: false
    depends_on:
      budget-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/budget/en || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net
      - observability-internal

networks:
  gateway-net:
    name: gateway-net
    external: true
  app-budget-net:
    name: app-budget-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
