services:
  pantry-db:
    image: postgres:16-alpine
    container_name: pantry-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pantry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pantry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pantry-internal
    stop_grace_period: 10s

  pantry-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pantry-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@pantry-db:5432/pantry
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=pantry-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      pantry-db:
        condition: service_healthy
    networks:
      - public-ingress
      - pantry-internal
      - shopping-internal
      - observability-internal

  pantry-frontend:
    build:
      context: ../..
      dockerfile: apps/pantry/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_PANTRY_API_URL:-http://api.alfheim.loegien.localhost/pantry/api/v1}
        - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-http://api.alfheim.loegien.localhost/auth}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: pantry-frontend
    restart: always
    env_file:
      - .env
    depends_on:
      pantry-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/pantry/en || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - public-ingress

volumes:
  postgres_data:

networks:
  public-ingress:
    name: public-ingress
    external: true
  pantry-internal:
    name: pantry-internal
  shopping-internal:
    name: shopping-internal
  observability-internal:
    name: observability-internal
    external: true
