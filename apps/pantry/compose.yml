services:
  pantry-db:
    image: postgres:16-alpine
    container_name: pantry-db
    restart: always
    environment:
      POSTGRES_USER: ${PANTRY_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PANTRY_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${PANTRY_POSTGRES_DB:-pantry}
    volumes:
      - pantry_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PANTRY_POSTGRES_USER:-postgres} -d ${PANTRY_POSTGRES_DB:-pantry}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-pantry-net
    stop_grace_period: 10s

  pantry-backend:
    build:
      context: ../..
      dockerfile: apps/pantry/backend/Dockerfile
    container_name: pantry-backend
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${PANTRY_DATABASE_URL:-postgresql+asyncpg://${PANTRY_POSTGRES_USER:-postgres}:${PANTRY_POSTGRES_PASSWORD:-postgres}@pantry-db:5432/${PANTRY_POSTGRES_DB:-pantry}}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=pantry-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      pantry-db:
        condition: service_healthy
    networks:
      - gateway-net
      - app-pantry-net
      - observability-internal

  pantry-frontend:
    build:
      context: ../..
      dockerfile: apps/pantry/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_PANTRY_API_URL:-http://api.alfheim.loegien.localhost/pantry/api/v1}
        - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-http://api.alfheim.loegien.localhost/auth}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: pantry-frontend
    restart: always
    env_file:
      - path: .env
        required: false
    depends_on:
      pantry-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/pantry/en', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway-net

volumes:
  pantry_postgres_data:

networks:
  gateway-net:
    name: gateway-net
    external: true
  app-pantry-net:
    name: app-pantry-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
