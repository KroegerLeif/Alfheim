services:
  pantry-db:
    image: postgres:16-alpine
    container_name: pantry-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pantry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pantry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pantry-internal

  pantry-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pantry-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@pantry-db:5432/pantry
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=pantry-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      pantry-db:
        condition: service_healthy
    networks:
      - public-ingress
      - pantry-internal
      - shopping-internal
      - observability-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pantry-backend.rule=Host(`loeger-os`) && PathPrefix(`/api/v1/pantry`)"
      - "traefik.http.routers.pantry-backend.entrypoints=web"
      - "traefik.http.routers.pantry-backend.middlewares=pantry-api-replace"
      - "traefik.http.routers.pantry-backend.service=pantry-backend-service"
      - "traefik.http.middlewares.pantry-api-replace.replacepathregex.regex=^/api/v1/pantry/(api/v1/)?(.*)"
      - "traefik.http.middlewares.pantry-api-replace.replacepathregex.replacement=/api/v1/$$2"
      - "traefik.http.services.pantry-backend-service.loadbalancer.server.port=8000"

  pantry-frontend:
    build:
      context: ../..
      dockerfile: apps/pantry/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1/pantry}
    container_name: pantry-frontend
    restart: always
    env_file:
      - .env
    depends_on:
      pantry-backend:
        condition: service_healthy
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/pantry/en || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - public-ingress
    labels:
      - "traefik.enable=true"
      # Catch-all router for standard subpath asset routing (e.g., /pantry/en, /pantry/_next/...)
      - "traefik.http.routers.pantry-frontend.rule=Host(`loeger-os`) && PathPrefix(`/pantry`)"
      - "traefik.http.routers.pantry-frontend.entrypoints=web"
      - "traefik.http.routers.pantry-frontend.service=pantry-frontend-service"
      
      # Explicit router for root/basePath direct hits
      - "traefik.http.routers.pantry-exact.rule=Host(`loeger-os`) && (Path(`/pantry`) || Path(`/pantry/`))"
      - "traefik.http.routers.pantry-exact.entrypoints=web"
      - "traefik.http.routers.pantry-exact.middlewares=pantry-redirect-en"
      - "traefik.http.routers.pantry-exact.service=pantry-frontend-service"
      
      # Redirect /pantry or /pantry/ directly to /pantry/en to prevent Next.js 404s
      - "traefik.http.middlewares.pantry-redirect-en.redirectregex.regex=^(https?://[^/]+)/pantry/?$$"
      - "traefik.http.middlewares.pantry-redirect-en.redirectregex.replacement=$${1}/pantry/en"
      - "traefik.http.middlewares.pantry-redirect-en.redirectregex.permanent=false"
      
      - "traefik.http.services.pantry-frontend-service.loadbalancer.server.port=3000"

volumes:
  postgres_data:

networks:
  public-ingress:
    name: public-ingress
    external: true
  pantry-internal:
    name: pantry-internal
  shopping-internal:
    name: shopping-internal
  observability-internal:
    name: observability-internal
    external: true
