services:
  pantry-db:
    image: postgres:16-alpine
    container_name: pantry-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pantry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pantry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - loeger-os-network

  pantry-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pantry-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@pantry-db:5432/pantry
    depends_on:
      pantry-db:
        condition: service_healthy
    networks:
      - loeger-os-network

  pantry-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/pantry/api}
    container_name: pantry-frontend
    restart: always
    env_file:
      - .env
    depends_on:
      - pantry-backend
    environment:
      - PORT=3000
    networks:
      - loeger-os-network

volumes:
  postgres_data:

networks:
  loeger-os-network:
    name: loeger-os-network
    external: true
