[project]
name = "pantry-backend"
version = "0.1.0"
description = "Backend microservice for the alfheim Pantry application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=13.0.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.8",
    "fastmcp>=3.4.1",
    "pint>=0.25.3",
    "pydantic-settings>=2.11.0",
    "pyjwt[crypto]>=2.8.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.39.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.15",
    "ty>=0.0.72",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "**/mcp_tools.py",
    "**/seeder.py",
    "**/mcp/*",
    "**/clients/open_food_facts.py",
]
