services:
  chat-db:
    image: postgres:16-alpine
    container_name: chat-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_db
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-chat-net
    stop_grace_period: 10s

  chat-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@chat-db:5432/chat_db?sslmode=disable
      - KEYCLOAK_BASE_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=alfheim
      - S3_ENDPOINT=http://rustfs:9000
      - S3_PUBLIC_URL=http://api.alfheim.loegien.localhost/storage
      - CHAT_MCP_SERVERS=pantry=http://pantry-backend:8000/mcp,chores=http://chores-backend:8000/mcp,maintenance=http://maintenance-backend:8000/mcp
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/chat/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      chat-db:
        condition: service_healthy
    networks:
      - gateway-net
      - app-chat-net
      - observability-internal

  chat-frontend:
    build:
      context: ../..
      dockerfile: apps/chat/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_CHAT_API_URL:-http://api.alfheim.loegien.localhost/api/v1/chat}
        - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:-http://api.alfheim.loegien.localhost/auth}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://alfheim.loegien.localhost}
    container_name: chat-frontend
    restart: always
    env_file:
      - .env
    depends_on:
      chat-backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_OPTIONS=--max-http-header-size=65536
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/chat/de', (res) => process.exit(res.statusCode < 400 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gateway-net

volumes:
  chat_postgres_data:

networks:
  gateway-net:
    name: gateway-net
    external: true
  app-chat-net:
    name: app-chat-net
    external: true
  observability-internal:
    name: observability-internal
    external: true
