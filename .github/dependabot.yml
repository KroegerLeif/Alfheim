version: 2
updates:
  # Python dependencies (uv workspace, resolved from uv.lock)
  - package-ecosystem: uv
    directory: '/'
    # PRs go to dev; main only receives dev via release merges.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    # One PR per ecosystem for minor/patch bumps; majors stay separate.
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'
    allow:
      - dependency-type: 'direct'
      - dependency-type: 'indirect'

  # Go module dependencies
  - package-ecosystem: gomod
    directory: '/apps/chat/backend'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  - package-ecosystem: gomod
    directory: '/core/dashboard/backend'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  - package-ecosystem: gomod
    directory: '/core/household/backend'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  - package-ecosystem: gomod
    directory: '/tools/installer'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  # Node.js / npm dependencies (managed via pnpm)
  - package-ecosystem: npm
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:tooling'

  # Base images in every Dockerfile (apps, core services, Caddy gateway)
  - package-ecosystem: docker
    directories:
      - '/apps/*/backend'
      - '/apps/*/frontend'
      - '/core/*/backend'
      - '/core/*/frontend'
      - '/infrastructure/caddy'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  # Image tags referenced from compose files
  - package-ecosystem: docker-compose
    directories:
      - '/'
      - '/apps/*'
      - '/core/*'
      - '/infrastructure'
      - '/infrastructure/caddy'
      - '/infrastructure/telemetry'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'
