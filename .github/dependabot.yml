version: 2
updates:
  # Python dependencies (uv workspace, resolved from uv.lock)
  - package-ecosystem: uv
    directory: '/'
    # PRs go to dev; main only receives dev via release merges.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    # One PR per ecosystem for minor/patch bumps and one for minor/patch
    # security fixes. Majors stay separate (one PR each) so frameworks such as
    # Next.js, React and FastAPI get an individual review.
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'
    allow:
      - dependency-type: 'direct'
      - dependency-type: 'indirect'

  # Go module dependencies
  - package-ecosystem: gomod
    directory: '/apps/chat/backend'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  - package-ecosystem: gomod
    directory: '/core/dashboard/backend'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  - package-ecosystem: gomod
    directory: '/core/household/backend'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  - package-ecosystem: gomod
    directory: '/tools/installer'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'

  # Node.js / npm dependencies (managed via pnpm)
  - package-ecosystem: npm
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'
    ignore:
      # eslint-config-next's plugins still declare an eslint ^9 peer; revisit when it supports eslint 10.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # Keep @types/node on the runtime major (Node 24 LTS); bump it together with the images.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:tooling'

  # Base images in every Dockerfile (apps, core services, Caddy gateway)
  - package-ecosystem: docker
    directories:
      - '/apps/*/backend'
      - '/apps/*/frontend'
      - '/core/*/backend'
      - '/core/*/frontend'
      - '/infrastructure/caddy'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
      # A major bump of one image (e.g. postgres) is one PR across every
      # directory instead of one per compose file or Dockerfile.
      major-per-image:
        update-types: ['major']
        group-by: dependency-name
        patterns: ['*']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'
    ignore:
      # Stay on the Node LTS line; moving to the next LTS is a deliberate, tested change.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  # Image tags referenced from compose files
  - package-ecosystem: docker-compose
    directories:
      - '/'
      - '/apps/*'
      - '/core/*'
      - '/infrastructure'
      - '/infrastructure/caddy'
      - '/infrastructure/telemetry'
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        update-types: ['minor', 'patch']
      minor-and-patch:
        update-types: ['minor', 'patch']
      # A major bump of one image (e.g. postgres) is one PR across every
      # directory instead of one per compose file or Dockerfile.
      major-per-image:
        update-types: ['major']
        group-by: dependency-name
        patterns: ['*']
    pull-request-branch-name:
      separator: '/'
    labels:
      - 'area:dependencies'
      - 'area:security'
    ignore:
      # A Zitadel major (v4 -> v5) is a planned migration (database steps, removed v1 APIs,
      # login UI changes), not a tag bump; see issue #765 for how v2 -> v4 was done.
      - dependency-name: 'zitadel/zitadel'
        update-types: ['version-update:semver-major']
