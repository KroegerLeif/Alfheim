name: Attest with Retry
description: >
  Runs actions/attest up to three times. The Sigstore transparency log (Rekor)
  intermittently answers 404 right after an entry is written; one transient
  failure must not fail a release leg and leave a half-published release.
  Without sbom-path the attestation is SLSA build provenance; with sbom-path it
  is an SBOM attestation.

inputs:
  subject-name:
    description: Subject name as it appears in the attestation (required with subject-digest).
    required: false
    default: ''
  subject-digest:
    description: Subject digest in the form "sha256:<hex>".
    required: false
    default: ''
  subject-checksums:
    description: Path to a checksums file listing the subjects.
    required: false
    default: ''
  sbom-path:
    description: Path to an SPDX or CycloneDX JSON SBOM; switches actions/attest to SBOM mode.
    required: false
    default: ''
  push-to-registry:
    description: Push the attestation to the image registry next to the subject.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The three attempts stay identical on purpose: `uses:` steps cannot loop,
    # so the retry is spelled out with continue-on-error and outcome checks.
    - name: Attest (Attempt 1)
      id: attempt_1
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        subject-checksums: ${{ inputs.subject-checksums }}
        sbom-path: ${{ inputs.sbom-path }}
        push-to-registry: ${{ inputs.push-to-registry }}

    - name: Wait Before Attempt 2
      if: steps.attempt_1.outcome == 'failure'
      shell: bash
      run: sleep 20

    - name: Attest (Attempt 2)
      id: attempt_2
      if: steps.attempt_1.outcome == 'failure'
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        subject-checksums: ${{ inputs.subject-checksums }}
        sbom-path: ${{ inputs.sbom-path }}
        push-to-registry: ${{ inputs.push-to-registry }}

    - name: Wait Before Attempt 3
      if: steps.attempt_2.outcome == 'failure'
      shell: bash
      run: sleep 60

    - name: Attest (Attempt 3)
      id: attempt_3
      if: steps.attempt_2.outcome == 'failure'
      continue-on-error: true
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.subject-name }}
        subject-digest: ${{ inputs.subject-digest }}
        subject-checksums: ${{ inputs.subject-checksums }}
        sbom-path: ${{ inputs.sbom-path }}
        push-to-registry: ${{ inputs.push-to-registry }}

    - name: Fail After Three Attempts
      if: steps.attempt_3.outcome == 'failure'
      shell: bash
      run: |
        echo "::error::actions/attest failed three times; see the attempts above."
        exit 1
