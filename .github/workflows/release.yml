name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege by default; jobs that publish or upload scan results raise
# exactly the scope they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-ancestry:
    name: Verify Release Tag Ancestry on Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch Main Branch
        run: git fetch origin main:main

      - name: Check Branch Ancestry
        run: |
          echo "Verifying if tagged commit ${{ github.sha }} belongs to main history..."
          if ! git merge-base --is-ancestor ${{ github.sha }} main; then
            echo "Error: Tagged commit ${{ github.sha }} is not an ancestor of origin/main."
            echo "Release tags must originate from the main branch."
            exit 1
          fi
          echo "Branch ancestry check passed: Tagged commit belongs to main."

  python-quality:
    name: Python Quality Gate (Ruff & Ty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12 and uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Root Workspace
        run: uv sync --all-packages --all-groups --locked

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run ty Type Checker
        run: uv run ty check

  python-tests:
    name: Pytest & Coverage (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/pantry/backend
          - apps/shopping/backend
          - apps/maintenance/backend
          - apps/chores/backend
          - apps/workout/backend
          - apps/budget/backend
          - apps/library/backend
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12 and uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Backend Dependencies
        run: uv sync --all-groups --locked

      - name: Run Pytest with Coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=95

  go-tests:
    name: Go Test Matrix (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/chat/backend
          - core/dashboard/backend
          - core/household/backend
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: '${{ matrix.service }}/go.sum'

      - name: Check Code Formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit & Integration Tests with Race Detector & Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

  frontend-tests:
    name: Frontend Quality Gate & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check Across Workspace
        run: pnpm check-types

      - name: Run Vitest Suite Across Workspace
        run: pnpm -r test

  build-images:
    name: Build & Push (${{ matrix.name }})
    needs:
      - check-ancestry
      - python-quality
      - python-tests
      - go-tests
      - frontend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Ingress Gateway (custom build with ACME DNS-01 provider modules)
          - name: caddy
            context: infrastructure/caddy
            dockerfile: infrastructure/caddy/Dockerfile

          # Core Platform Services
          - name: dashboard-backend
            context: core/dashboard/backend
            dockerfile: core/dashboard/backend/Dockerfile
          - name: dashboard-frontend
            context: .
            dockerfile: core/dashboard/frontend/Dockerfile

          # Household & Roles Core Service
          - name: household-backend
            context: core/household/backend
            dockerfile: core/household/backend/Dockerfile
          - name: household-frontend
            context: .
            dockerfile: core/household/frontend/Dockerfile

          # Chat Assistant Service
          - name: chat-backend
            context: apps/chat/backend
            dockerfile: apps/chat/backend/Dockerfile
          - name: chat-frontend
            context: .
            dockerfile: apps/chat/frontend/Dockerfile

          # Pantry Management Service
          - name: pantry-backend
            context: .
            dockerfile: apps/pantry/backend/Dockerfile
          - name: pantry-frontend
            context: .
            dockerfile: apps/pantry/frontend/Dockerfile

          # Shopping List Service
          - name: shopping-backend
            context: .
            dockerfile: apps/shopping/backend/Dockerfile
          - name: shopping-frontend
            context: .
            dockerfile: apps/shopping/frontend/Dockerfile

          # Maintenance & Devices Service
          - name: maintenance-backend
            context: .
            dockerfile: apps/maintenance/backend/Dockerfile
          - name: maintenance-frontend
            context: .
            dockerfile: apps/maintenance/frontend/Dockerfile

          # Household Chores Service
          - name: chores-backend
            context: .
            dockerfile: apps/chores/backend/Dockerfile
          - name: chores-frontend
            context: .
            dockerfile: apps/chores/frontend/Dockerfile

          # Budget & Finance Service
          - name: budget-backend
            context: .
            dockerfile: apps/budget/backend/Dockerfile
          - name: budget-frontend
            context: .
            dockerfile: apps/budget/frontend/Dockerfile

          # Workout Tracking Service
          - name: workout-backend
            context: .
            dockerfile: apps/workout/backend/Dockerfile
          - name: workout-frontend
            context: .
            dockerfile: apps/workout/frontend/Dockerfile

          # Media Library Service
          - name: library-backend
            context: .
            dockerfile: apps/library/backend/Dockerfile
          - name: library-frontend
            context: .
            dockerfile: apps/library/frontend/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases (any tag with a "-" suffix such as -rc.1, -beta, -alpha)
      # get only their version tag; `latest` always points at a stable release.
      - name: Compute Image Tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ env.IMAGE_REPO }}/${{ matrix.name }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${REF_NAME}"
            if [[ "$REF_NAME" != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Build into the local Docker daemon first so the image can be scanned
      # before anything is pushed to the registry. `load: true` cannot hold a
      # multi-platform result, so each platform is built, loaded and scanned on
      # its own; the multi-arch manifest is only pushed once both gates pass.
      - name: Build Container Image for Scanning (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan/${{ matrix.name }}:${{ github.sha }}-amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Build Container Image for Scanning (linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          load: true
          push: false
          tags: scan/${{ matrix.name }}:${{ github.sha }}-arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan Container Image (SARIF Report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}-amd64
          format: 'sarif'
          output: '${{ matrix.name }}-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: '${{ matrix.name }}-trivy-results.sarif'
          category: 'trivy-image-${{ matrix.name }}'

      # Gate: fixable CRITICAL/HIGH findings block the push, so a vulnerable
      # image never reaches the registry or the `latest` tag.
      - name: Fail on Fixable Critical/High Vulnerabilities (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}-amd64
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Fail on Fixable Critical/High Vulnerabilities (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}-arm64
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # Layers come from the cache populated by the scan builds above, so this
      # only assembles and pushes the multi-arch manifest.
      - name: Push Multi-Arch Container Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.name }}

  build-installer:
    name: Build Installer Binaries (${{ matrix.goarch }})
    needs:
      - check-ancestry
      - go-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: 'tools/installer/go.sum'

      - name: Build Static Binary
        working-directory: tools/installer
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X main.version=${{ github.ref_name }} \
              -X main.commit=${{ github.sha }} \
              -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "alfheim-setup_linux_${{ matrix.goarch }}" \
            ./cmd/alfheim-setup

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-${{ matrix.goarch }}
          path: tools/installer/alfheim-setup_linux_${{ matrix.goarch }}
          if-no-files-found: error

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-images, build-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Installer Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Stage Standalone Install Assets
        working-directory: dist
        run: |
          # install.sh fetches these onto a bare host that has no checkout of
          # the repo, so they must ship as release assets in their own right,
          # not just live under infrastructure/ for the local-repo install
          # path. Release assets are flattened to their basename, so staging
          # them here under their final upload name keeps SHA256SUMS (and
          # install.sh's lookup into it) matched to what actually gets
          # downloaded.
          cp ../compose.prod.yaml compose.prod.yaml
          cp ../infrastructure/telemetry/collector/config.yaml otelcol-config.yaml
          cp ../infrastructure/postgres/init-multiple-dbs.sh init-multiple-dbs.sh
          cp ../infrastructure/telemetry/vector/vector.toml vector.toml
          # `alfheim-setup update` fetches and verifies its own copy of this
          # script on every release too (see internal/shared/assets), so it
          # ships here the same way the other standalone stack files do.
          cp ../scripts/verify-stack.sh verify-stack.sh

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum alfheim-setup_linux_* compose.prod.yaml otelcol-config.yaml init-multiple-dbs.sh vector.toml verify-stack.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release & Attach Production Artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          files: |
            dist/alfheim-setup_linux_amd64
            dist/alfheim-setup_linux_arm64
            dist/SHA256SUMS
            dist/compose.prod.yaml
            dist/otelcol-config.yaml
            dist/init-multiple-dbs.sh
            dist/vector.toml
            dist/verify-stack.sh
            install.sh
            .env.example
            infrastructure/caddy/Caddyfile
