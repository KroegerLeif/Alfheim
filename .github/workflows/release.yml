name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  # Dry run on the release PR: the same tests, builds and Trivy gates, without
  # publishing anything. Unlike workflow_dispatch, this works before this file
  # exists on the default branch.
  pull_request:
    branches:
      - main
  # Manual dry run on any branch (see the verify-release how-to).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: test, build and scan only. Nothing is pushed, tagged or released.'
        type: boolean
        default: true

env:
  # 'true' for pull requests and manual runs with dry_run enabled, 'false' for
  # tag pushes, the only event that publishes.
  DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}

# Least privilege by default; jobs that publish or upload scan results raise
# exactly the scope they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # New pushes to a release PR supersede the running dry run; tag runs never
  # cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-ancestry:
    name: Verify Release Tag Ancestry on Main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only a tag push may publish. A manual run with dry_run disabled would
      # push images from an arbitrary branch, so it is refused outright.
      - name: Refuse Manual Runs Without Dry Run
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "Error: releases are created by pushing a v*.*.* tag, not by a manual run."
          echo "Re-run with dry_run enabled to verify a branch."
          exit 1

      - name: Checkout Repository with Full History
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch Main Branch
        if: github.event_name == 'push'
        run: git fetch origin main:main

      - name: Check Branch Ancestry
        if: github.event_name == 'push'
        run: |
          echo "Verifying if tagged commit ${{ github.sha }} belongs to main history..."
          if ! git merge-base --is-ancestor ${{ github.sha }} main; then
            echo "Error: Tagged commit ${{ github.sha }} is not an ancestor of origin/main."
            echo "Release tags must originate from the main branch."
            exit 1
          fi
          echo "Branch ancestry check passed: Tagged commit belongs to main."

  python-quality:
    name: Python Quality Gate (Ruff & Ty)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12 and uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Root Workspace
        run: uv sync --all-packages --all-groups --locked

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run ty Type Checker
        run: uv run ty check

  python-tests:
    name: Pytest & Coverage (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/pantry/backend
          - apps/shopping/backend
          - apps/maintenance/backend
          - apps/chores/backend
          - apps/workout/backend
          - apps/budget/backend
          - apps/library/backend
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12 and uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Backend Dependencies
        run: uv sync --all-groups --locked

      - name: Run Pytest with Coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=95

  go-tests:
    name: Go Test Matrix (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/chat/backend
          - core/dashboard/backend
          - core/household/backend
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: '${{ matrix.service }}/go.sum'

      - name: Check Code Formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit & Integration Tests with Race Detector & Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

  frontend-tests:
    name: Frontend Quality Gate & Vitest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check Across Workspace
        run: pnpm check-types

      - name: Run Vitest Suite Across Workspace
        run: pnpm -r test

  # Single source of truth for the image list. Emits `images` (one entry per
  # image, used by the manifest job) and `builds` (image x platform with the
  # native runner of each platform, used by the build job).
  plan-images:
    name: Plan Image Build Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.plan.outputs.images }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - name: Compute Matrices
        id: plan
        run: |
          images=$(cat <<'JSON'
          [
                      {"name": "caddy", "context": "infrastructure/caddy", "dockerfile": "infrastructure/caddy/Dockerfile"},
            {"name": "dashboard-backend", "context": "core/dashboard/backend", "dockerfile": "core/dashboard/backend/Dockerfile"},
            {"name": "dashboard-frontend", "context": ".", "dockerfile": "core/dashboard/frontend/Dockerfile"},
            {"name": "household-backend", "context": "core/household/backend", "dockerfile": "core/household/backend/Dockerfile"},
            {"name": "household-frontend", "context": ".", "dockerfile": "core/household/frontend/Dockerfile"},
            {"name": "chat-backend", "context": "apps/chat/backend", "dockerfile": "apps/chat/backend/Dockerfile"},
            {"name": "chat-frontend", "context": ".", "dockerfile": "apps/chat/frontend/Dockerfile"},
            {"name": "pantry-backend", "context": ".", "dockerfile": "apps/pantry/backend/Dockerfile"},
            {"name": "pantry-frontend", "context": ".", "dockerfile": "apps/pantry/frontend/Dockerfile"},
            {"name": "shopping-backend", "context": ".", "dockerfile": "apps/shopping/backend/Dockerfile"},
            {"name": "shopping-frontend", "context": ".", "dockerfile": "apps/shopping/frontend/Dockerfile"},
            {"name": "maintenance-backend", "context": ".", "dockerfile": "apps/maintenance/backend/Dockerfile"},
            {"name": "maintenance-frontend", "context": ".", "dockerfile": "apps/maintenance/frontend/Dockerfile"},
            {"name": "chores-backend", "context": ".", "dockerfile": "apps/chores/backend/Dockerfile"},
            {"name": "chores-frontend", "context": ".", "dockerfile": "apps/chores/frontend/Dockerfile"},
            {"name": "budget-backend", "context": ".", "dockerfile": "apps/budget/backend/Dockerfile"},
            {"name": "budget-frontend", "context": ".", "dockerfile": "apps/budget/frontend/Dockerfile"},
            {"name": "workout-backend", "context": ".", "dockerfile": "apps/workout/backend/Dockerfile"},
            {"name": "workout-frontend", "context": ".", "dockerfile": "apps/workout/frontend/Dockerfile"},
            {"name": "library-backend", "context": ".", "dockerfile": "apps/library/backend/Dockerfile"},
            {"name": "library-frontend", "context": ".", "dockerfile": "apps/library/frontend/Dockerfile"}
          ]
          JSON
          )
          echo "images=$(jq -c . <<<"$images")" >> "$GITHUB_OUTPUT"
          builds=$(jq -c '[.[] as $i | ("amd64","arm64") as $a | $i + {
            arch: $a,
            platform: ("linux/" + $a),
            runner: (if $a == "arm64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end)
          }]' <<<"$images")
          echo "builds=${builds}" >> "$GITHUB_OUTPUT"
          echo "Planned $(jq length <<<"$builds") image builds."

  # One job per image and platform, each on a runner of that architecture, so
  # nothing is emulated. Every platform is built, scanned and gated on its own.
  # A passing build is pushed by digest only (no tag); the manifest job below
  # is what makes it reachable.
  build-images:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    needs:
      - check-ancestry
      - python-quality
      - python-tests
      - go-tests
      - frontend-tests
      - plan-images
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan-images.outputs.builds) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local Docker daemon first so the image can be scanned
      # before anything is pushed to the registry.
      - name: Build Container Image for Scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: scan/${{ matrix.name }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

      # The SARIF report covers linux/amd64 only; both platforms are built from
      # the same Dockerfile and both are gated below.
      - name: Scan Container Image (SARIF Report)
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}-${{ matrix.arch }}
          format: 'sarif'
          output: '${{ matrix.name }}-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      # Skipped in a dry run so branch builds never create code scanning
      # alerts. The gate below still fails the run on the same findings.
      - name: Upload Trivy Results to GitHub Security Tab
        if: always() && matrix.arch == 'amd64' && env.DRY_RUN != 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: '${{ matrix.name }}-trivy-results.sarif'
          category: 'trivy-image-${{ matrix.name }}'

      # Gate: fixable CRITICAL/HIGH findings block the push, so a vulnerable
      # image never reaches the registry or the `latest` tag.
      - name: Fail on Fixable Critical/High Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}-${{ matrix.arch }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      # Layers come from the cache populated by the scan build above. The image
      # is pushed by digest without a tag; nothing references it until the
      # manifest job runs.
      - name: Push Image by Digest
        id: push
        if: env.DRY_RUN != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_REPO }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}

      - name: Export Digest
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload Digest
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform digests of each image into one multi-arch
  # manifest under the final tags. It needs every build job, so no image is
  # tagged unless all images passed both platform gates. Tag pushes only.
  merge-manifests:
    name: Publish Manifest (${{ matrix.name }})
    if: github.event_name == 'push'
    needs:
      - plan-images
      - build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-images.outputs.images) }}
    steps:
      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases (any tag with a "-" suffix such as -rc.1, -beta, -alpha)
      # get only their version tag; `latest` always points at a stable release.
      - name: Create Multi-Arch Manifest
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ env.IMAGE_REPO }}/${{ matrix.name }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(-t "${IMAGE}:${REF_NAME}")
          if [[ "$REF_NAME" != *-* ]]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "Error: expected 2 platform digests for ${IMAGE}, found ${#sources[@]}."
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect Manifest
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ env.IMAGE_REPO }}/${{ matrix.name }}
        run: docker buildx imagetools inspect "${IMAGE}:${REF_NAME}"

  build-installer:
    name: Build Installer Binaries (${{ matrix.goarch }})
    needs:
      - check-ancestry
      - go-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: 'tools/installer/go.sum'

      - name: Build Static Binary
        working-directory: tools/installer
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w \
              -X main.version=${{ github.ref_name }} \
              -X main.commit=${{ github.sha }} \
              -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "alfheim-setup_linux_${{ matrix.goarch }}" \
            ./cmd/alfheim-setup

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.goarch }}
          path: tools/installer/alfheim-setup_linux_${{ matrix.goarch }}
          if-no-files-found: error

  publish-release:
    name: Publish Official GitHub Release
    if: github.event_name == 'push'
    needs: [merge-manifests, build-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Installer Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Stage Standalone Install Assets
        working-directory: dist
        run: |
          # install.sh fetches these onto a bare host that has no checkout of
          # the repo, so they must ship as release assets in their own right,
          # not just live under infrastructure/ for the local-repo install
          # path. Release assets are flattened to their basename, so staging
          # them here under their final upload name keeps SHA256SUMS (and
          # install.sh's lookup into it) matched to what actually gets
          # downloaded.
          cp ../compose.prod.yaml compose.prod.yaml
          cp ../infrastructure/telemetry/collector/config.yaml otelcol-config.yaml
          cp ../infrastructure/postgres/init-multiple-dbs.sh init-multiple-dbs.sh
          cp ../infrastructure/telemetry/vector/vector.toml vector.toml
          cp ../infrastructure/telemetry/victoriametrics/scrape.yml victoriametrics-scrape.yml
          # `alfheim-setup update` fetches and verifies its own copy of this
          # script on every release too (see internal/shared/assets), so it
          # ships here the same way the other standalone stack files do.
          cp ../scripts/verify-stack.sh verify-stack.sh

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum alfheim-setup_linux_* compose.prod.yaml otelcol-config.yaml init-multiple-dbs.sh vector.toml victoriametrics-scrape.yml verify-stack.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release & Attach Production Artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          files: |
            dist/alfheim-setup_linux_amd64
            dist/alfheim-setup_linux_arm64
            dist/SHA256SUMS
            dist/compose.prod.yaml
            dist/otelcol-config.yaml
            dist/init-multiple-dbs.sh
            dist/vector.toml
            dist/victoriametrics-scrape.yml
            dist/verify-stack.sh
            install.sh
            .env.example
            infrastructure/caddy/Caddyfile
