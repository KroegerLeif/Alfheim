name: CI Orchestrator

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      python: ${{ github.ref == 'refs/heads/main' || steps.filter.outputs.python == 'true' }}
      go: ${{ github.ref == 'refs/heads/main' || steps.filter.outputs.go == 'true' }}
      frontend: ${{ github.ref == 'refs/heads/main' || steps.filter.outputs.frontend == 'true' }}
      infra: ${{ github.ref == 'refs/heads/main' || steps.filter.outputs.infra == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'apps/*/backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
            go:
              - 'core/dashboard/backend/**'
              - 'apps/chat/backend/**'
              - 'go.work'
              - '**/go.mod'
              - '**/go.sum'
            frontend:
              - 'apps/*/frontend/**'
              - 'core/dashboard/frontend/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            infra:
              - 'infrastructure/**'
              - 'scripts/**'
              - 'compose*.yml'
              - 'Dockerfile*'

  python:
    name: Python Pipeline (Placeholder)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder Step
        run: echo "Python CI placeholder - to be implemented by dedicated tasks"

  go:
    name: Go Pipeline (Placeholder)
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder Step
        run: echo "Go CI placeholder - to be implemented by dedicated tasks"

  frontend:
    name: Frontend Pipeline (Placeholder)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder Step
        run: echo "Frontend CI placeholder - to be implemented by dedicated tasks"

  infra:
    name: Infrastructure Pipeline (Placeholder)
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder Step
        run: echo "Infrastructure CI placeholder - to be implemented by dedicated tasks"
