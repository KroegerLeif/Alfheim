name: Go Quality Gate & Test Matrix

# Reusable gate: triggered by ci-required.yml (path filtering and the
# aggregated required check live there). workflow_dispatch runs it standalone.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Go Test Matrix (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/chat/backend
          - core/dashboard/backend
          - core/household/backend
          - packages/go-shared
          - tools/installer
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    # Migration round-trip tests (#916) create scratch databases here; they skip
    # themselves when ALFHEIM_MIGRATION_TEST_DATABASE_URL is unset.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.27
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: '${{ matrix.service }}/go.sum'

      - name: Check Code Formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Run Go Vet
        run: go vet ./...

      - name: Check Doc Comments on Exported Identifiers (revive)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.service }}
          args: --enable-only revive

      # Tests with the race detector and the module's coverage gate (#813).
      # The gates live in scripts/check-go-coverage.sh, shared with verify.sh.
      - name: Run Go Tests with Race Detector & Enforce Coverage Gate
        working-directory: .
        env:
          ALFHEIM_MIGRATION_TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres?sslmode=disable
        run: ./scripts/check-go-coverage.sh "${{ matrix.service }}"

  installer-quality:
    name: Installer Cross-Compile & Dry Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/installer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.27
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: 'tools/installer/go.sum'

      - name: Cross-Compile Static Binaries (linux/amd64, linux/arm64)
        run: |
          for target in linux/amd64 linux/arm64; do
            echo "Building ${target}..."
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/alfheim-setup
          done

      - name: Verify Headless Dry Run
        run: |
          go run ./cmd/alfheim-setup --version
          go run ./cmd/alfheim-setup --dry-run --non-interactive \
            --domain alfheim.example.com --tls internal \
            --admin-email admin@alfheim.example.com \
            --install-dir "$(mktemp -d)"
