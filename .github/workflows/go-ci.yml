name: Go Quality Gate & Test Matrix

# Reusable gate: triggered by ci-required.yml (path filtering and the
# aggregated required check live there). workflow_dispatch runs it standalone.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Go Test Matrix (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/chat/backend
          - core/dashboard/backend
          - core/household/backend
          - tools/installer
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: '${{ matrix.service }}/go.sum'

      - name: Check Code Formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit & Integration Tests with Race Detector & Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

  installer-quality:
    name: Installer Coverage Gate & Cross-Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/installer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: 'tools/installer/go.sum'

      - name: Enforce Minimum Test Coverage (>= 80%)
        run: |
          go test -race -covermode=atomic \
            -coverpkg=./internal/... -coverprofile=coverage.out ./...
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total installer coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 80.0) ? 0 : 1 }' || {
            echo "::error::Installer coverage ${pct}% is below the required 80% gate."
            exit 1
          }

      - name: Cross-Compile Static Binaries (linux/amd64, linux/arm64)
        run: |
          for target in linux/amd64 linux/arm64; do
            echo "Building ${target}..."
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/alfheim-setup
          done

      - name: Verify Headless Dry Run
        run: |
          go run ./cmd/alfheim-setup --version
          go run ./cmd/alfheim-setup --dry-run --non-interactive \
            --domain alfheim.example.com --tls internal \
            --admin-email admin@alfheim.example.com \
            --install-dir "$(mktemp -d)"
