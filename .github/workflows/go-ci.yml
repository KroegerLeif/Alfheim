name: Go Quality Gate & Test Matrix

on:
  push:
    branches:
      - main
    paths:
      - 'apps/chat/backend/**'
      - 'core/dashboard/backend/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/chat/backend/**'
      - 'core/dashboard/backend/**'
      - '.github/workflows/go-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Go Test Matrix (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/chat/backend
          - core/dashboard/backend
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: '${{ matrix.service }}/go.mod'
          cache-dependency-path: '${{ matrix.service }}/go.sum'

      - name: Run Go Unit & Integration Tests with Race Detector
        run: go test -v -race -cover ./...
