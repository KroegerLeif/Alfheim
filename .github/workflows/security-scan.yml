name: Security Scanning (Dependencies & Containers)

# The secret scan runs on every push and pull request. The dependency and
# image scans are path-filtered by the `changes` job: they only run when a
# manifest, lockfile, Dockerfile, compose file (or Go code for govulncheck)
# changed. Scheduled and manual runs execute every scan.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  # Weekly run catches newly published advisories and secrets on unchanged paths.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      node: ${{ steps.filter.outputs.node }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout Repository
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scheduled and manual runs skip the filter; every scan job runs then.
      - name: Filter Changed Paths
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/security-scan.yml'
            python:
              - *workflow
              - '**/pyproject.toml'
              - 'uv.lock'
            go:
              - *workflow
              - 'go.work'
              - '**/go.mod'
              - '**/go.sum'
              # govulncheck reports only reachable code, so code changes count.
              - '**/*.go'
            node:
              - *workflow
              - '**/package.json'
              - 'pnpm-lock.yaml'
            images:
              - *workflow
              - '.github/workflows/release.yml'
              - '**/pyproject.toml'
              - 'uv.lock'
              - 'go.work'
              - '**/go.mod'
              - '**/go.sum'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - '**/Dockerfile'
              - '**/compose*.y*ml'

  python-audit:
    name: Python Dependency Audit (pip-audit)
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12 and uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Root Workspace
        run: uv sync --all-packages --all-groups --locked

      - name: Run pip-audit on Root Workspace
        run: uvx pip-audit --desc

  go-vulncheck:
    name: Go Dependency Audit (govulncheck)
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/chat/backend
          - core/dashboard/backend
          - core/household/backend
          - tools/installer
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go 1.27
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: '${{ matrix.service }}/go.sum'

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Never path-filtered: a secret can land in any file.
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history so every commit of a push or PR range is scanned.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  npm-audit:
    name: Node.js Dependency Audit (pnpm audit)
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  trivy-scan:
    name: Trivy Filesystem & Config Scanning
    needs: changes
    if: needs.changes.outputs.images == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # upload-sarif >= 4.39 reads the workflow run to attribute the analysis.
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # Code scanning is only available for public repositories (or with GitHub
      # Advanced Security). Without it the findings are printed to the job log.
      - name: Print Trivy Findings (No Code Scanning)
        if: always() && github.event.repository.visibility != 'public'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'
