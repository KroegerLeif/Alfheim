name: Frontend Quality Gate & Test Suite

# Reusable gate: triggered by ci-required.yml (path filtering and the
# aggregated required check live there). workflow_dispatch runs it standalone.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate-and-tests:
    name: Frontend Quality Gate & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check Across Workspace
        run: pnpm check-types

      - name: Run Vitest Suite Across Workspace
        run: pnpm -r test
