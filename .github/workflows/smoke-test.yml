name: Container Smoke Test

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'infrastructure/**'
      - 'scripts/**'
      - 'compose*.yml'
      - 'compose*.yaml'
      - 'Dockerfile*'
      - '**/Dockerfile*'
      - '.github/workflows/smoke-test.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'infrastructure/**'
      - 'scripts/**'
      - 'compose*.yml'
      - 'compose*.yaml'
      - 'Dockerfile*'
      - '**/Dockerfile*'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Headless Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create External Gateway Network
        run: docker network create gateway-net || true

      - name: Spin up Caddy Gateway
        run: docker compose -f infrastructure/caddy/compose.yml up -d --build

      - name: Health Verification Retry Loop
        run: |
          echo "Waiting for Caddy gateway on http://127.0.0.1/ ..."
          timeout=60
          elapsed=0
          until curl --fail -s http://127.0.0.1/ > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "Error: Caddy failed to respond on http://127.0.0.1/ within $timeout seconds."
              docker compose -f infrastructure/caddy/compose.yml logs
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Caddy gateway is healthy and reachable at http://127.0.0.1/!"

      - name: Teardown Caddy Gateway
        if: always()
        run: docker compose -f infrastructure/caddy/compose.yml down -v
