name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'websites/landing/**'
      - 'websites/portal/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'packages/shared/**'
      - '.github/workflows/deploy-docs.yml'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'websites/landing/**'
      - 'websites/portal/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Relative links between Markdown files break silently when a document moves.
  # This gate fails the build instead of shipping a dead link.
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check relative Markdown links
        run: python3 scripts/check-markdown-links.py

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Astro 7 requires Node >= 22.12.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The landing page must be built first: its Vite config sets
      # emptyOutDir, which would wipe a portal already copied into dist/docs.
      - name: Build Landing Page
        run: pnpm --filter @alfheim/landing build

      - name: Build Documentation Portal
        run: pnpm --filter @alfheim/docs-portal build

      # "src/." copies the contents rather than the directory itself,
      # which would otherwise nest as dist/docs/dist.
      - name: Merge Portal into Landing Artifact
        run: |
          mkdir -p websites/landing/dist/docs
          cp -r websites/portal/dist/. websites/landing/dist/docs/
          test -f websites/landing/dist/index.html
          test -f websites/landing/dist/docs/en/index.html
          test -d websites/landing/dist/docs/pagefind

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './websites/landing/dist'

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    # Only real deployments serialise; PR builds must not queue behind them.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
