name: Python Quality Gate & Test Matrix

on:
  push:
    branches:
      - main
    paths:
      - 'apps/*/backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/*/backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync Root Workspace
        run: uv sync --all-packages --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

  type-check:
    name: ty Static Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync Root Workspace
        run: uv sync --all-packages --all-groups

      - name: Run ty Type Checker
        run: uv run ty check --output-format github

  test-matrix:
    name: Pytest & Coverage (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/pantry/backend
          - apps/shopping/backend
          - apps/maintenance/backend
          - apps/chores/backend
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync Backend Dependencies
        run: uv sync --all-groups

      - name: Run Pytest with Coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
