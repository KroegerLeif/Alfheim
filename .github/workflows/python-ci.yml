name: Python Quality Gate & Test Matrix

on:
  push:
    branches:
      - main
    paths:
      - 'apps/*/backend/**'
      - 'packages/backend-shared/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/*/backend/**'
      - 'packages/backend-shared/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Python Quality Gate (Ruff & Ty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Root Workspace
        run: uv sync --all-packages --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run ty Type Checker
        run: uv run ty check

  test-matrix:
    name: Pytest & Coverage (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/pantry/backend
          - apps/shopping/backend
          - apps/maintenance/backend
          - apps/chores/backend
          - apps/workout/backend
          - apps/budget/backend
          - apps/library/backend
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Backend Dependencies
        run: uv sync --all-groups

      - name: Run Pytest with Coverage
        # TODO(release-v0.1.0): Raise threshold to 95 after test elevation phase
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=75
